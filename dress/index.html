  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0}
#gate[hidden],#switchwho[hidden]{display:none}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px}

.x:hover{color:var(--rose)}
.status{font-size:13px;color:var(--rose);margin-bottom:12px;min-height:1em}
#sheet[hidden]{display:none}
#summary:empty{display:none}
/* Compact grid: about four dresses per phone screen. */

.link.more{font-size:20px;line-height:1;padding:2px 8px;letter-spacing:.1em}

#sheet{position:fixed;inset:0;background:var(--veil);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

<body>

<div class="wrap">
  <header class="top">
    <div class="script">Dress Diary</div>
    <h1>ドレス日記</h1>
    <div class="sub" id="summary"></div>
  </header>
  <main id="main"><div class="notice">読み込み中です</div></main>
  <button id="switchwho" class="link" type="button" hidden></button>
</div>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="ドレスの詳細"></div>
<div id="zoom" hidden role="dialog" aria-label="写真の拡大"></div>
<input type="file" id="picker" accept="image/*" multiple hidden>

<div id="gate" hidden>
  <div class="gatebox">
    <div class="script">Dress Diary</div>
    <h1>ドレス日記</h1>
    <form id="gateform">
      <input type="text" id="gatepass" placeholder="合言葉" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="gatewho">
        <button class="btn primary" type="submit" name="who" value="pon"><span class="av pon" aria-hidden="true">ぽ</span>ぽん</button>
        <button class="btn primary" type="submit" name="who" value="pi"><span class="av pi" aria-hidden="true">ぴ</span>ぴー</button>
      </div>
      <div class="gatemsg" id="gatemsg" aria-live="polite"></div>
    </form>
  </div>
</div>

<script>
// Stands in for the claude.ai runtime: the page code talks to these three
// objects, and they keep everything in Firestore so no sign-in is needed.
(() => {
  const FIREBASE = { projectId: "dress-diary-6fec8" };
  // Any of these spellings opens the page.
  const PASS = ["オレンジ", "おれんじ", "orange"];
  const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
  const REST = "https://firestore.googleapis.com/v1/projects/" + FIREBASE.projectId + "/databases/(default)/documents/";
  const KEY = "dress:who";
  const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const write = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

  const gate = document.getElementById("gate");
  const sw = document.getElementById("switchwho");
  const whoReady = new Promise((resolve) => {
    const who = read(KEY);
    if (who === "pon" || who === "pi") { resolve(who); return; }
    gate.hidden = false;
    document.getElementById("gateform").addEventListener("submit", (e) => {
      e.preventDefault();
      const pass = document.getElementById("gatepass").value.trim();
      if (!PASS.includes(pass.normalize("NFKC").toLowerCase())) { document.getElementById("gatemsg").textContent = "合言葉がちがいます"; return; }
      const w = e.submitter && e.submitter.value;
      if (w !== "pon" && w !== "pi") return;
      write(KEY, w);
      gate.hidden = true;
      resolve(w);
    });
  });
  whoReady.then((w) => {
    sw.textContent = (w === "pon" ? "ぽん" : "ぴー") + "として使っています・切り替える";
    sw.hidden = false;
    sw.onclick = () => { write(KEY, null); location.reload(); };
  });

  let fsP = null;
  const fs = () => fsP || (fsP = Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-firestore.js")]).then(([app, f]) => ({ f, db: f.getFirestore(app.initializeApp(FIREBASE)) })));

  // The page names per-person docs data/users/<id>/state; they live at state/<id> here.
  const mapPath = (p) => { const m = /^data\/users\/([^/]+)\/state$/.exec(p); return m ? "state/" + m[1] : p; };
  const wrapDoc = (d) => ({ id: d.id, exists: d.exists(), data: () => d.data() });

  function makeDb(f, fdb) {
    const coll = (name) => {
      let q = f.collection(fdb, name);
      return {
        orderBy(field) { q = f.query(q, f.orderBy(field)); return this; },
        onSnapshot(fn, err) { return f.onSnapshot(q, (s) => fn({ docs: s.docs.map(wrapDoc) }), err); },
        add(data) { return f.addDoc(f.collection(fdb, name), data); },
      };
    };
    const doc = (path) => {
      const ref = f.doc(fdb, mapPath(path));
      return {
        onSnapshot(fn, err) { return f.onSnapshot(ref, (d) => fn(wrapDoc(d)), err); },
        set(data) { return f.setDoc(ref, data); },
        // Nested objects merge field by field, as the page expects.
        update(data) {
          const pairs = [];
          const walk = (obj, path) => {
            for (const [k, v] of Object.entries(obj)) {
              if (v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length) walk(v, path.concat(k));
              else pairs.push(new f.FieldPath(...path.concat(k)), v);
            }
          };
          walk(data, []);
          return pairs.length ? f.updateDoc(ref, ...pairs) : Promise.resolve();
        },
        delete() { return f.deleteDoc(ref); },
      };
    };
    return { collection: coll, doc };
  }

  // Photos are stored as data URLs in images/<id>, kept under Firestore's 1 MB document limit.
  async function toDataUrl(blob) {
    let bmp = null;
    try { bmp = await createImageBitmap(blob); } catch (e) {}
    if (!bmp) return await new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = j; fr.readAsDataURL(blob); });
    for (const [size, q] of [[1600, 0.82], [1400, 0.75], [1200, 0.7], [1000, 0.65]]) {
      const k = Math.min(1, size / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", q);
      if (url.length < 950000) return url;
    }
    throw Object.assign(new Error("too large"), { code: "too_large" });
  }
  const cache = new Map();
  window.loadAsset = (id) => {
    // A plain REST read: Safari stalls on big docs over the live channel.
    if (!cache.has(id)) cache.set(id, fetch(REST + "images/" + encodeURIComponent(id) + "?mask.fieldPaths=d")
      .then((r) => r.ok ? r.json() : Promise.reject(new Error("http " + r.status)))
      .then((j) => j.fields.d.stringValue)
      .catch(() => fs().then(async ({ f, db }) => {
        const d = await f.getDoc(f.doc(db, "images", id));
        if (!d.exists()) throw new Error("missing");
        return d.data().d;
      })));
    return cache.get(id);
  };

  window.claude = {
    async use(name) {
      const who = await whoReady;
      const { f, db } = await fs();
      if (name === "db") return makeDb(f, db);
      if (name === "user") return {
        me: async () => ({ id: who, name: who === "pon" ? "ぽん" : "ぴー", isOwner: who === "pon" }),
        can: async () => true,
        profiles: async () => ({}),
      };
      if (name === "assets") return {
        async upload(blob) {
          const d = await toDataUrl(blob);
          const ref = await f.addDoc(f.collection(db, "images"), { d, at: Date.now(), by: who });
          cache.set(ref.id, Promise.resolve(d));
          return { id: ref.id };
        },
        delete: (id) => f.deleteDoc(f.doc(db, "images", id)),
      };
      return null;
    },
  };
})();
</script>

<script>
(() => {
  const main = document.getElementById("main");
  const sheet = document.getElementById("sheet");
  const zoom = document.getElementById("zoom");
  const picker = document.getElementById("picker");
  let addTo = null; // a dress id when adding pictures to it instead of making a new one
  const summary = document.getElementById("summary");

  let db = null, user = null, assets = null, me = null, canWrite = true;
  const S = { shops: [], photos: [], comments: [], ready: 0 };
  // where: "shops" (list of shops), "shop" (one shop), "all" (every photo)
  let view = { where: "shops", shop: null, photo: null, renaming: false, confirmShop: false, confirmPhoto: false };
  let status = "";
  let mySeen = null, seenRef = null;

  const store = { get(k, d) { try { return localStorage.getItem("dress:" + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("dress:" + k, v); } catch (e) {} } };
  let filter = store.get("filter", "all");
  const sort = "no";

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "src" && typeof v === "string" && v.startsWith("asset:")) {
        const id = v.slice(6);
        n.dataset.asset = id;
        window.loadAsset(id).then((u) => { n.src = u; }).catch(() => n.dispatchEvent(new Event("error")));
      }
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const src = (id) => "asset:" + id;
  const fmt = (t) => {
    const d = new Date(t);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  };
  // A dress has one picture per side (front, back); older rows only have `asset`.
  const sidesOf = (p) => (p.assets && p.assets.length ? p.assets : [p.asset]);
  const shopPhotos = (id) => S.photos.filter((p) => p.shopId === id);
  const photoComments = (id) => S.comments.filter((c) => c.photoId === id);
  const votes = (p) => Object.entries(p.votes || {}).filter(([, v]) => v === "ari" || v === "nashi");
  const VOTE = { ari: "あり", nashi: "なし" };
  const isMe = (id) => !!(me && me.id && id === me.id);

  // ぽん is the page's owner; everyone else who writes here is ぴー.
  let ownerId = null;
  const ponId = () => ownerId || (me && me.isOwner ? me.id : null);
  const nameOf = (id) => !id ? "だれか" : id === ponId() ? "ぽん" : "ぴー";
  const avatar = (id, who) => { const n = who || nameOf(id); return el("span", { class: "av " + (n === "ぽん" ? "pon" : "pi"), "aria-hidden": "true", text: n.slice(0, 1) }); };
  const ponVote = (p) => { const id = ponId(); return id ? (p.votes || {})[id] || null : null; };
  const piVote = (p) => { const id = ponId(); const v = votes(p).find(([k]) => k !== id); return v ? v[1] : null; };
  const piIdOf = (p) => { const id = ponId(); const v = votes(p).find(([k]) => k !== id); return v ? v[0] : (me && me.id && me.id !== id ? me.id : null); };
  const myVote = (p) => (me && me.id ? (p.votes || {})[me.id] || null : null);
  const ariCount = (p) => votes(p).filter(([, v]) => v === "ari").length;
  const nashiCount = (p) => votes(p).filter(([, v]) => v === "nashi").length;
  const numberOf = (p) => shopPhotos(p.shopId).findIndex((x) => x.id === p.id) + 1;
  const hasNew = (p) => {
    if (!me || !me.id || !mySeen) return false;
    const cs = photoComments(p.id);
    // Writing a comment yourself counts as having read what came before it.
    const seen = Math.max((mySeen.seen || {})[p.id] || 0, ...cs.filter((c) => c.by === me.id).map((c) => c.at || 0));
    return cs.some((c) => c.by && c.by !== me.id && c.at > seen);
  };

  const FILTERS = [
    ["all", "すべて", () => true],
    ["both", "ふたりともあり", (p) => ponVote(p) === "ari" && piVote(p) === "ari"],
    ["pon", "ぽんがあり", (p) => ponVote(p) === "ari"],
    ["pi", "ぴーがあり", (p) => piVote(p) === "ari"],
  ];
  if (!FILTERS.some(([k]) => k === filter)) filter = "all";
  const SORTS = [["no", "番号順"], ["ari", "ありが多い順"], ["cmt", "コメントが多い順"], ["newc", "コメントが新しい順"]];
  const lastComment = (p) => photoComments(p.id).reduce((m, c) => Math.max(m, c.at || 0), 0);
  const shopOrder = () => {
    const idx = new Map(sortedShops().map((s, i) => [s.id, i]));
    return (p) => idx.has(p.shopId) ? idx.get(p.shopId) : 999;
  };
  function applyList(ps) {
    const f = (FILTERS.find(([k]) => k === filter) || FILTERS[0])[2];
    const so = shopOrder();
    const byNo = (a, b) => so(a) - so(b) || a.createdAt - b.createdAt;
    const out = ps.filter(f);
    if (sort === "ari") out.sort((a, b) => ariCount(b) - ariCount(a) || nashiCount(a) - nashiCount(b) || byNo(a, b));
    else if (sort === "cmt") out.sort((a, b) => photoComments(b.id).length - photoComments(a.id).length || byNo(a, b));
    else if (sort === "newc") out.sort((a, b) => lastComment(b) - lastComment(a) || byNo(a, b));
    else out.sort(byNo);
    return out;
  }
  const sortedShops = () => [...S.shops].sort((a, b) => {
    return a.createdAt - b.createdAt;
  });

  // ---------- tabs ----------
  function renderTabs() {
    return el("div", { class: "tabs", role: "group", "aria-label": "表示" },
      el("button", { type: "button", "aria-pressed": view.where === "shops" ? "true" : "false", onclick: () => setHash(""), text: "お店ごと" }),
      el("button", { type: "button", "aria-pressed": view.where === "all" ? "true" : "false", onclick: () => setHash("#all"), text: "ぜんぶ" }));
  }

  // ---------- filter + sort bar ----------
  function renderBar(ps) {
    const chips = el("div", { class: "filters", role: "group", "aria-label": "しぼりこみ" });
    for (const [k, label, f] of FILTERS) {
      const n = ps.filter(f).length;
      chips.append(el("button", { class: "fchip" + (n || k === filter ? "" : " zero"), type: "button", "aria-pressed": k === filter ? "true" : "false",
        onclick: () => { filter = k; store.set("filter", k); render(); } }, document.createTextNode(label), el("b", { text: String(n) })));
    }
    return el("div", { class: "bar" }, chips);
  }

  // ---------- list of shops ----------
  function renderShops() {
    const frag = document.createDocumentFragment();
    frag.append(renderTabs());
    if (canWrite) {
      const input = el("input", { type: "text", id: "newshop", placeholder: "お店の名前を入れて追加", maxlength: "60" });
      frag.append(el("form", { class: "addshop", onsubmit: async (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) return;
        input.value = "";
        try { await db.collection("shops").add({ name, createdAt: Date.now(), createdBy: me?.id || null }); }
        catch (err) { flash("お店を追加できませんでした（" + err.code + "）"); }
      } }, input, el("button", { class: "btn primary", type: "submit", text: "＋ お店" })));
    }
    if (!S.shops.length) {
      frag.append(el("div", { class: "notice" }, document.createTextNode(canWrite ? "まだお店がありません。上の欄にお店の名前を入れると、そのお店のフォルダができます。" : "まだお店がありません。")));
      return frag;
    }
    const grid = el("div", { class: "shops" });
    for (const s of sortedShops()) {
      const ps = shopPhotos(s.id);
      const both = ps.filter(FILTERS[1][2]).length;
      const fresh = ps.some(hasNew);
      const glass = el("div", { class: "glass" });
      if (ps.length) glass.append(el("img", { src: src(sidesOf(ps[0])[0]), alt: "", loading: "lazy" }));
      else glass.append(el("span", { class: "initial", text: (s.name || "?").slice(0, 1) }));
      if (both) glass.append(el("span", { class: "both", text: "ふたりともあり " + both }));
      glass.append(el("span", { class: "stack", text: ps.length + "着" }));
      grid.append(el("button", { class: "shop", type: "button", onclick: () => go(s.id) },
        el("div", { class: "mirror" }, glass),
        el("span", { class: "name" }, document.createTextNode(s.name), fresh ? el("span", { class: "newdot", title: "新しいコメント" }) : null),
));
    }
    frag.append(grid);
    return frag;
  }

  // ---------- one card ----------
  function voteRow(p) {
    const row = el("span", { class: "vrow" });
    const pid = ponId();
    const people = [[pid, "ぽん"], [piIdOf(p), "ぴー"]];
    for (const [id, who] of people) {
      const v = id ? (p.votes || {})[id] : null;
      if (id && isMe(id) && canWrite && (v === "ari" || v === "nashi")) {
        // Once chosen, only the choice shows; tapping it clears it so the two buttons come back.
        row.append(el("button", { class: "chip pick " + v, type: "button", title: "押すと選び直せます", "aria-label": who + "：" + VOTE[v] + "（押すと選び直し）", onclick: (e) => { e.stopPropagation(); vote(p, v); } }, avatar(id, who), document.createTextNode(VOTE[v])));
      } else if (id && isMe(id) && canWrite) {
        const mini = el("span", { class: "mini" }, avatar(id, who));
        for (const k of ["ari", "nashi"]) mini.append(el("button", { class: k + (v === k ? " on" : ""), type: "button", "aria-pressed": v === k ? "true" : "false", "aria-label": who + "：" + VOTE[k], onclick: (e) => { e.stopPropagation(); vote(p, k); }, text: VOTE[k] }));
        row.append(mini);
      } else if (v === "ari" || v === "nashi") {
        row.append(el("span", { class: "chip " + v }, avatar(id, who), document.createTextNode(VOTE[v])));
      }
    }
    return row;
  }

  function card(p, showShop) {
    const n = photoComments(p.id).length;
    const shop = S.shops.find((s) => s.id === p.shopId);
    return el("div", { class: "photo" },
      el("button", { class: "imgbtn", type: "button", "aria-label": (shop ? shop.name + " " : "") + "No." + numberOf(p) + " を開く", onclick: () => openPhoto(p.id) },
        el("span", { class: "no" }, document.createTextNode("No." + numberOf(p))),
        el("img", { src: src(sidesOf(p)[0]), alt: "ドレスの写真", loading: "lazy", onerror: (e) => e.target.replaceWith(el("div", { class: "ph" })) })),
      el("div", { class: "cap" },
        showShop && shop ? el("span", { class: "shopname", text: shop.name }) : null,
        el("span", { class: "row" },
          voteRow(p),
          el("span", { class: "cc" }, document.createTextNode("💬 " + n), hasNew(p) ? el("span", { class: "newdot", title: "新しいコメント" }) : null))));
  }

  function photoGrid(list, showShop) {
    if (!list.length) return el("div", { class: "empty", text: "この条件の写真はありません" });
    const grid = el("div", { class: "photos" });
    for (const p of list) grid.append(card(p, showShop));
    return grid;
  }

  // ---------- every photo ----------
  function renderAll() {
    const frag = document.createDocumentFragment();
    frag.append(renderTabs());
    if (!S.photos.length) { frag.append(el("div", { class: "notice", text: "まだ写真がありません。お店を開いて写真を追加してください。" })); return frag; }
    frag.append(renderBar(S.photos), el("div", { class: "status", "aria-live": "polite", text: status }), photoGrid(applyList(S.photos), true));
    return frag;
  }

  // ---------- one shop ----------
  function renderShop(shop) {
    const frag = document.createDocumentFragment();
    const ps = shopPhotos(shop.id);
    const tools = el("div", { class: "tools" });
    if (canWrite && assets) tools.append(el("button", { class: "btn primary", type: "button", onclick: () => { addTo = null; picker.click(); }, text: "＋ 1着を追加" }));
    if (canWrite) tools.append(el("button", { class: "link", type: "button", onclick: () => { view.renaming = !view.renaming; render(); }, text: "店名を編集" }));
    if (canWrite && ps.length === 0) {
      tools.append(view.confirmShop
        ? el("span", { class: "tools" }, el("button", { class: "btn danger", type: "button", onclick: deleteShop, text: "本当に削除" }), el("button", { class: "link", type: "button", onclick: () => { view.confirmShop = false; render(); }, text: "やめる" }))
        : el("button", { class: "link", type: "button", onclick: () => { view.confirmShop = true; render(); }, text: "このお店を削除" }));
    }
    const both = ps.filter(FILTERS[1][2]).length;
    frag.append(el("div", { class: "shophead" },
      el("div", { class: "left" },
        el("button", { class: "btn backbtn", type: "button", onclick: () => go(null), text: "‹ お店の一覧にもどる" }),
        el("h2", {}, document.createTextNode(shop.name), el("span", { class: "h2count", text: ps.length + "着" }))),
      tools));
    if (view.renaming) {
      const input = el("input", { type: "text", id: "rename", value: shop.name, maxlength: "60" });
      frag.append(el("form", { class: "rename", onsubmit: async (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) return;
        view.renaming = false;
        try { await db.doc("shops/" + shop.id).update({ name }); } catch (err) { flash("名前を変えられませんでした（" + err.code + "）"); }
        render();
      } }, input, el("button", { class: "btn", type: "submit", text: "保存" })));
    }
    frag.append(el("div", { class: "status", "aria-live": "polite", text: status }));
    if (canWrite && !assets) frag.append(el("div", { class: "notice", text: "写真の追加は、このページの編集者だけができます。あり・なしとコメントは使えます。" }));
    if (!ps.length) {
      frag.append(el("div", { class: "notice" }, document.createTextNode(assets ? "「写真を追加」から、このお店で着たドレスの写真を選んでください。何枚でもまとめて選べます。" : "まだ写真がありません。")));
      return frag;
    }
    frag.append(renderBar(ps), photoGrid(applyList(ps), false));
    return frag;
  }

  // The photos the viewer is paging through: the list they opened it from.
  function navList() {
    const p = S.photos.find((x) => x.id === view.photo);
    if (!p) return [];
    const base = view.from === "all" ? S.photos : shopPhotos(p.shopId);
    const list = applyList(base);
    return list.some((x) => x.id === p.id) ? list : applyList(base).concat([p]);
  }

  // ---------- photo sheet ----------
  function renderSheet() {
    const p = S.photos.find((x) => x.id === view.photo);
    if (!p) { closeSheet(); return; }
    const draftBox = document.getElementById("draft");
    const draft = draftBox && draftBox.dataset.photo === p.id ? draftBox.value : "";
    const hadDraftFocus = draftBox && document.activeElement === draftBox;
    const scroller = sheet.querySelector(".panel");
    const scrollTop = scroller && scroller.dataset.photo === p.id ? scroller.scrollTop : 0;

    const vs = votes(p);
    const mine = myVote(p);
    const likebar = el("div", { class: "likebar" });
    if (canWrite && me && me.id && !mine) for (const k of ["ari", "nashi"]) likebar.append(el("button", { class: "like " + k, type: "button", onclick: () => vote(p, k), text: VOTE[k] }));
    const lk = el("span", { class: "chips" });
    for (const [id, v] of vs) lk.append(el("span", { class: "chip " + v }, avatar(id), document.createTextNode(VOTE[v])));
    likebar.append(lk);
    if (canWrite && mine) likebar.append(el("button", { class: "link", type: "button", onclick: () => vote(p, mine), text: "選び直す" }));

    const list = el("div", { class: "comments" });
    const cs = photoComments(p.id);
    for (const c of cs) {
      const mineC = isMe(c.by);
      list.append(el("div", { class: "c" + (mineC ? " mine" : "") },
        avatar(c.by),
        el("div", { class: "bubble" },
          el("div", { class: "who" }, document.createTextNode(nameOf(c.by)), el("span", { class: "when", text: fmt(c.at) }),
            mineC ? el("button", { class: "link", type: "button", style: "margin-left:6px;font-size:12px", onclick: () => deleteComment(c.id), text: "消す" }) : null),
          el("div", { class: "txt", text: c.text }))));
    }

    const ta = el("textarea", { id: "draft", "data-photo": p.id, placeholder: "コメントを書く", onkeydown: (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendComment(); } } });
    ta.value = draft;
    const composer = canWrite ? el("div", { class: "composer" }, ta, el("button", { class: "btn primary", type: "button", onclick: sendComment, text: "送る" })) : null;

    // Editing is rare, so its buttons show only after tapping 編集.
    const sidesNow = sidesOf(p), shown = Math.min(view.side || 0, sidesNow.length - 1);
    const foot = canWrite ? el("div", { class: "foot" }, view.confirmPhoto === "ask"
      ? el("span", { class: "tools" }, el("button", { class: "btn danger", type: "button", onclick: () => deleteSide(p, shown), text: sidesNow.length > 1 ? "この写真を削除する" : "このドレスを削除する" }), el("button", { class: "link", type: "button", onclick: () => { view.confirmPhoto = false; renderSheet(); }, text: "やめる" }))
      : view.confirmPhoto
        ? el("span", { class: "tools" },
            assets ? el("button", { class: "btn", type: "button", onclick: () => { addTo = p.id; picker.click(); }, text: "写真を追加" }) : null,
            el("button", { class: "btn", type: "button", onclick: () => { view.confirmPhoto = "ask"; renderSheet(); }, text: "写真を削除" }),
            el("button", { class: "link", type: "button", onclick: () => { view.confirmPhoto = false; renderSheet(); }, text: "閉じる" }))
        : el("button", { class: "btn", type: "button", onclick: () => { view.confirmPhoto = true; renderSheet(); }, text: "編集" })) : null;

    const nl = navList();
    const i = nl.findIndex((x) => x.id === p.id);
    const prev = i > 0 ? nl[i - 1] : null, next = i >= 0 && i < nl.length - 1 ? nl[i + 1] : null;
    const sides = sidesOf(p);
    const side = Math.min(view.side || 0, sides.length - 1);
    const canPrev = side > 0 || !!prev, canNext = side < sides.length - 1 || !!next;
    const imgBox = el("div", { class: "img" },
      el("div", { class: "frame" }, el("img", { src: src(sides[side]), alt: "ドレスの写真（押すと拡大）", onclick: () => openZoom(p) })),
      el("button", { class: "nav prev", type: "button", "aria-label": "前へ", disabled: !canPrev, onclick: () => move(-1), text: "‹" }),
      el("button", { class: "nav next", type: "button", "aria-label": "次へ", disabled: !canNext, onclick: () => move(1), text: "›" }),
      el("span", { class: "no" }, document.createTextNode("No." + numberOf(p))),
      sides.length > 1 ? el("span", { class: "sides" }, ...sides.map((_, k) => el("i", { class: k === side ? "on" : "" }))) : null);
    let sx = null, sy = null;
    imgBox.addEventListener("touchstart", (e) => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
    imgBox.addEventListener("touchend", (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
    });

    const shop = S.shops.find((s) => s.id === p.shopId);
    const panel = el("div", { class: "panel", "data-photo": p.id },
      imgBox,
      el("div", { class: "side" },
        likebar,
        cs.length ? list : null,
        composer, foot));
    sheet.replaceChildren(panel, el("button", { class: "x", type: "button", "aria-label": "閉じる", onclick: back, text: "×" }));
    sheet.hidden = false;
    panel.scrollTop = scrollTop;
    if (hadDraftFocus) document.getElementById("draft")?.focus();
    markSeen(p);
  }

  // ---------- zoom ----------
  // Opens fitted to the screen; pinch or double-tap to zoom, drag to move.
  function openZoom(p) {
    const sides = sidesOf(p);
    const img = el("img", { src: src(sides[Math.min(view.side || 0, sides.length - 1)]), alt: "ドレスの写真（拡大）", draggable: "false" });
    zoom.replaceChildren(img, el("button", { class: "x", type: "button", "aria-label": "拡大を閉じる", onclick: closeZoom, text: "×", style: "z-index:31" }));
    zoom.hidden = false;
    let sc = 1, tx = 0, ty = 0;
    const fit = () => {
      const nw = img.naturalWidth, nh = img.naturalHeight;
      if (!nw || !nh) return;
      const k = Math.min(zoom.clientWidth / nw, zoom.clientHeight / nh);
      img.style.width = Math.floor(nw * k) + "px"; img.style.height = Math.floor(nh * k) + "px";
      apply();
    };
    img.addEventListener("load", fit);
    window.addEventListener("resize", fit);
    const W = () => zoom.clientWidth, H = () => zoom.clientHeight;
    const clamp = () => {
      sc = Math.min(5, Math.max(1, sc));
      const bw = img.offsetWidth, bh = img.offsetHeight;
      const mx = Math.max(0, (bw * sc - W()) / 2), my = Math.max(0, (bh * sc - H()) / 2);
      tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
    };
    const apply = () => { clamp(); img.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")"; };
    // Zoom so the point (x, y) on screen stays under the finger.
    const zoomAt = (x, y, next) => {
      const cx = x - W() / 2, cy = y - H() / 2;
      tx = cx - (cx - tx) * next / sc; ty = cy - (cy - ty) * next / sc; sc = next; apply();
    };
    let pts = new Map(), start = null, lastTap = 0;
    zoom.onpointerdown = (e) => {
      if (e.target.closest(".x")) return;
      zoom.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const now = Date.now();
      if (pts.size === 1 && now - lastTap < 300) { zoomAt(e.clientX, e.clientY, sc > 1.05 ? 1 : 2.5); lastTap = 0; start = null; return; }
      lastTap = now;
      const a = [...pts.values()];
      start = { sc, tx, ty, a: a.map((q) => ({ ...q })), d: a.length > 1 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0 };
    };
    zoom.onpointermove = (e) => {
      if (!pts.has(e.pointerId) || !start) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const a = [...pts.values()];
      if (a.length > 1 && start.d) {
        const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
        sc = start.sc; tx = start.tx; ty = start.ty;
        zoomAt(mx, my, start.sc * d / start.d);
      } else if (a.length === 1 && start.a.length === 1) {
        tx = start.tx + a[0].x - start.a[0].x; ty = start.ty + a[0].y - start.a[0].y; apply();
      }
    };
    const up = (e) => {
      pts.delete(e.pointerId);
      const a = [...pts.values()];
      start = a.length ? { sc, tx, ty, a: a.map((q) => ({ ...q })), d: 0 } : null;
    };
    zoom.onpointerup = up; zoom.onpointercancel = up;
    zoom.onwheel = (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, sc * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); };
    if (img.complete) fit(); else apply();
  }
  function closeZoom() { zoom.hidden = true; zoom.replaceChildren(); }

  // ---------- writes ----------
  let voting = false;
  async function vote(p, k) {
    if (voting || !me || !me.id) return;
    voting = true;
    const next = (p.votes || {})[me.id] === k ? null : k;
    try { await db.doc("photos/" + p.id).update({ votes: { [me.id]: next } }); }
    catch (err) { flash("選べませんでした（" + err.code + "）"); }
    voting = false;
  }

  // Remember, per person, when each photo's comments were last read.
  let seenChain = Promise.resolve();
  function markSeen(p) {
    if (!seenRef || !mySeen) return;
    const last = photoComments(p.id).reduce((m, c) => Math.max(m, c.at || 0), 0);
    if (!last || ((mySeen.seen || {})[p.id] || 0) >= last) return;
    mySeen = { ...mySeen, seen: { ...(mySeen.seen || {}), [p.id]: last } };
    const exists = mySeen.exists;
    mySeen.exists = true;
    seenChain = seenChain.then(() => exists ? seenRef.update({ seen: { [p.id]: last } }) : seenRef.set({ seen: mySeen.seen })).catch(() => {});
  }

  let sending = false;
  async function sendComment() {
    const box = document.getElementById("draft");
    const text = box ? box.value.trim() : "";
    if (!text || sending || !view.photo) return;
    sending = true;
    try {
      await db.collection("comments").add({ photoId: view.photo, text, by: me?.id || null, at: Date.now() });
      const d = document.getElementById("draft"); if (d) d.value = "";
    } catch (err) { flash("コメントを送れませんでした（" + err.code + "）"); }
    sending = false;
  }

  async function deleteComment(id) {
    try { await db.doc("comments/" + id).delete(); } catch (err) { flash("消せませんでした（" + err.code + "）"); }
  }

  async function deletePhoto(p) {
    try {
      for (const c of photoComments(p.id)) await db.doc("comments/" + c.id).delete();
      await db.doc("photos/" + p.id).delete();
      if (assets) for (const a of sidesOf(p)) { try { await assets.delete(a); } catch (e) { /* the row is gone; the file stays if someone else uploaded it */ } }
      if (view.from === "all") setHash("#all"); else go(p.shopId);
    } catch (err) { flash("削除できませんでした（" + err.code + "）"); }
  }

  // Removes the picture on screen; the last picture takes the whole dress with it.
  async function deleteSide(p, k) {
    const ss = sidesOf(p);
    if (ss.length <= 1) return deletePhoto(p);
    const rest = ss.filter((_, i) => i !== k);
    try {
      await db.doc("photos/" + p.id).update({ asset: rest[0], assets: rest });
      if (assets) { try { await assets.delete(ss[k]); } catch (e) {} }
      view.confirmPhoto = false; stepTo(p.id, Math.min(k, rest.length - 1));
    } catch (err) { flash("削除できませんでした（" + err.code + "）"); }
  }

  const prevInShop = (p) => { const ps = shopPhotos(p.shopId), i = ps.findIndex((x) => x.id === p.id); return i > 0 ? ps[i - 1] : null; };
  // Folds this entry's pictures, votes and comments into the dress before it.
  async function mergeIntoPrev(p) {
    const prev = prevInShop(p);
    if (!prev) return;
    try {
      const keep = sidesOf(prev).length;
      await db.doc("photos/" + prev.id).update({ assets: sidesOf(prev).concat(sidesOf(p)), votes: { ...(p.votes || {}), ...(prev.votes || {}) } });
      for (const c of photoComments(p.id)) await db.doc("comments/" + c.id).update({ photoId: prev.id });
      await db.doc("photos/" + p.id).delete();
      stepTo(prev.id, keep);
    } catch (err) { flash("まとめられませんでした（" + err.code + "）"); }
  }

  async function deleteShop() {
    const id = view.shop;
    if (!id || shopPhotos(id).length) return;
    try { await db.doc("shops/" + id).delete(); go(null); } catch (err) { flash("削除できませんでした（" + err.code + "）"); }
  }

  // ---------- uploads ----------
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const b = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
      if (b) return b;
    } catch (e) { /* fall back to the original file */ }
    return file;
  }

  // A wide picture is a front-and-back pair side by side: cut it into two.
  async function splitSides(file) {
    let bmp = null;
    try { bmp = await createImageBitmap(file); } catch (e) {}
    if (!bmp || bmp.width < bmp.height * 1.2) return [await shrink(file)];
    const half = Math.floor(bmp.width / 2), out = [];
    for (const x of [0, half]) {
      const k = Math.min(1, 1600 / Math.max(half, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(half * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, x, 0, half, bmp.height, 0, 0, c.width, c.height);
      out.push(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86)));
    }
    return out;
  }

  picker.addEventListener("change", async () => {
    const files = [...picker.files];
    picker.value = "";
    const target = addTo && S.photos.find((x) => x.id === addTo);
    addTo = null;
    const shopId = view.shop;
    if (!files.length || !shopId || !assets) return;
    // Pictures chosen together (front, back, ...) become one dress.
    let done = 0, failed = 0;
    const ids = [];
    for (const f of files) {
      setStatus("写真を追加しています… " + (done + failed + 1) + " / " + files.length);
      try {
        for (const blob of await splitSides(f)) ids.push((await assets.upload(blob, { type: blob.type || "image/jpeg" })).id);
        done++;
      } catch (err) {
        failed++;
      }
    }
    if (ids.length && target) {
      const had = sidesOf(target).length;
      try { await db.doc("photos/" + target.id).update({ assets: sidesOf(target).concat(ids) }); if (view.photo === target.id) stepTo(target.id, had); }
      catch (err) { failed += done; done = 0; }
      setStatus(failed ? done + "枚を足しました、" + failed + "枚は追加できませんでした" : done + "枚を足しました");
      setTimeout(() => setStatus(""), 4000);
      return;
    }
    if (ids.length) {
      try { await db.collection("photos").add({ shopId, asset: ids[0], assets: ids, votes: {}, createdAt: Date.now(), createdBy: me?.id || null }); }
      catch (err) { failed += done; done = 0; }
    }
    setStatus(failed ? done + "枚を1着として追加、" + failed + "枚は追加できませんでした" : done + "枚を1着として追加しました");
    setTimeout(() => setStatus(""), 4000);
  });

  // ---------- navigation (the hash keeps the phone's back gesture working) ----------
  const okId = (id) => /^[A-Za-z0-9-]+$/.test(id || "");
  function setHash(h) {
    if (location.hash === h || (!h && !location.hash)) { applyHash(); return; }
    if (h) location.hash = h;
    else history.pushState(null, "", location.pathname + location.search);
    applyHash();
  }
  function applyHash() {
    const h = location.hash.slice(1);
    let where = "shops", shop = null, photo = null;
    if (h.startsWith("p-")) {
      photo = h.slice(2);
      const p = S.photos.find((x) => x.id === photo);
      if (view.where === "all" || (view.photo && view.from === "all")) where = "all";
      else { where = "shop"; shop = p ? p.shopId : view.shop; }
    } else if (h.startsWith("s-")) { where = "shop"; shop = h.slice(2); }
    else if (h === "all") where = "all";
    const changed = where !== view.where || shop !== view.shop;
    if (changed) { view = { where, shop, photo: null, from: null, renaming: false, confirmShop: false, confirmPhoto: false }; status = ""; }
    if (photo !== view.photo) { view.side = 0; view.photo = photo; view.from = photo ? (where === "all" ? "all" : "shop") : null; view.confirmPhoto = false; sheet.replaceChildren(); }
    if (!photo) { sheet.hidden = true; sheet.replaceChildren(); closeZoom(); }
    render();
    if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", applyHash);
  window.addEventListener("popstate", applyHash);
  function go(shopId) { setHash(shopId && okId(shopId) ? "#s-" + shopId : ""); }
  function openPhoto(id) {
    if (okId(id)) setHash("#p-" + id);
    else { view.photo = id; view.from = view.where === "all" ? "all" : "shop"; view.confirmPhoto = false; sheet.replaceChildren(); renderSheet(); }
  }
  // Paging inside the viewer replaces the entry, so "back" still returns to the list.
  function stepTo(id, side = 0) {
    closeZoom();
    view.side = side;
    if (okId(id) && location.hash.startsWith("#p-")) { history.replaceState(null, "", "#p-" + id); view.photo = id; view.confirmPhoto = false; renderSheet(); }
    else { view.photo = id; view.confirmPhoto = false; renderSheet(); }
  }
  // Swiping walks front, back, then on to the next dress.
  function move(dir) {
    const p = S.photos.find((x) => x.id === view.photo);
    if (!p) return;
    const n = sidesOf(p).length, side = Math.min(view.side || 0, n - 1);
    if (side + dir >= 0 && side + dir < n) { view.side = side + dir; closeZoom(); renderSheet(); return; }
    const nl = navList(), i = nl.findIndex((x) => x.id === p.id), t = nl[i + dir];
    if (i >= 0 && t) stepTo(t.id, dir > 0 ? 0 : sidesOf(t).length - 1);
  }
  function closeSheet() {
    view.photo = null; view.confirmPhoto = false;
    sheet.hidden = true;
    sheet.replaceChildren();
    render();
  }
  function back() {
    if (!zoom.hidden) { closeZoom(); return; }
    if (view.photo) {
      if (location.hash.startsWith("#p-")) { if (view.from === "all") setHash("#all"); else go(view.shop); }
      else closeSheet();
    } else go(null);
  }
  sheet.addEventListener("click", (e) => { if (e.target === sheet) back(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && (!sheet.hidden || !zoom.hidden)) { back(); return; }
    if (sheet.hidden || !zoom.hidden) return;
    const t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "SELECT")) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      move(e.key === "ArrowRight" ? 1 : -1);
    }
  });

  function setStatus(t) { status = t; const s = main.querySelector(".status"); if (s) s.textContent = t; }
  function flash(t) { setStatus(t); if (!main.querySelector(".status")) summary.textContent = t; }

  function render() {
    if (S.ready < 3) return;
    summary.textContent = "";
    const shop = view.shop && S.shops.find((s) => s.id === view.shop);
    if (view.where === "shop" && !shop) { view.where = "shops"; view.shop = null; }
    // The title belongs to the top screens only; inside a shop the shop name is the heading.
    document.querySelector("header.top").hidden = view.where === "shop";
    const y = window.scrollY;
    main.replaceChildren(view.where === "all" ? renderAll() : shop ? renderShop(shop) : renderShops());
    window.scrollTo(0, y);
    if (view.photo) renderSheet();
  }

  let pending = null, routed = false;
  function update() {
    if (pending) return;
    pending = Promise.resolve().then(() => {
      pending = null;
      if (!routed && S.ready >= 3) { routed = true; applyHash(); } else render();
    });
  }

  function fail(msg) { main.replaceChildren(el("div", { class: "notice", text: msg })); }

  async function start() {
    if (!window.claude || !window.claude.use) { fail("読み込めませんでした。ページを開き直してください。"); return; }
    [db, user, assets] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("assets")]);
    if (!db) { fail("データを読み込めませんでした。電波のよい所で開き直してください。"); return; }
    if (user) {
      me = await user.me();
      const c = await user.can("data.write");
      if (c === false) canWrite = false;
    }
    db.doc("settings/owner").onSnapshot((d) => {
      ownerId = d.exists ? d.data().id : null;
      if (me && me.isOwner && me.id && ownerId !== me.id && canWrite) db.doc("settings/owner").set({ id: me.id }).catch(() => {});
      if (S.ready >= 3) render();
    }, () => {});
    if (me && me.id) {
      seenRef = db.doc("data/users/" + me.id + "/state");
      seenRef.onSnapshot((d) => {
        const data = d.exists ? d.data() : {};
        // Keep marks made locally that the server has not echoed yet.
        mySeen = { exists: d.exists || !!(mySeen && mySeen.exists), seen: { ...((mySeen && mySeen.seen) || {}), ...(data.seen || {}) } };
        if (S.ready >= 3) render();
      }, () => { mySeen = null; });
    }
    const onErr = (e) => fail("データの読み込みが止まりました（" + e.code + "）。ページを開き直してください。");
    const seen = {};
    const mark = (k) => { if (!seen[k]) { seen[k] = true; S.ready++; } };
    db.collection("shops").orderBy("createdAt").onSnapshot((s) => { S.shops = s.docs.map((d) => ({ id: d.id, ...d.data() })); mark("shops"); update(); }, onErr);
    db.collection("photos").orderBy("createdAt").onSnapshot((s) => { S.photos = s.docs.map((d) => ({ id: d.id, ...d.data() })); mark("photos"); update(); }, onErr);
    db.collection("comments").orderBy("at").onSnapshot((s) => { S.comments = s.docs.map((d) => ({ id: d.id, ...d.data() })); mark("comments"); update(); }, onErr);
  }
  start();
})();
</script>
</body>
</html>
