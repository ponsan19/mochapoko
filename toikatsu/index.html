:root{

}

:root[data-theme="dark"]{--bg:#0f1614;--surface:#17211e;--soft:#1f2c28;--fg:#e9f0ed;--muted:#9cada6;--line:#2a3833;--band:#115e59;--accent:#2dd4bf;--accent-ink:#04201b;--accent-soft:#143a35;--warn:#fbbf24;--trial:#f472b6;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1.25;margin:0;text-wrap:balance}

.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

[hidden]{display:none!important}
.opts label{display:flex;align-items:center;gap:6px}
select,input[type=time]{font:inherit;font-size:.9rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}

#out{display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:8px}
.gh{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,48px));z-index:4;display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:12px;background:var(--band);color:#ffffff}
.gh .t{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}

.gh .cnt{margin-left:auto;font-size:.8rem;opacity:.75}

.top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.dojo{font-weight:700;font-size:1.02rem;min-width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;flex:none}
.cn{font-size:.92rem;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem}

.tag.free{background:transparent;border:1px solid var(--muted);color:var(--muted)}
.off{display:inline-block;background:#d32f2f;color:#fff;font-size:.75rem;font-weight:700;padding:0 8px;border-radius:999px}
.card.is-off .dojo,.card.is-off .cn{text-decoration:line-through;opacity:.6}

.links a{color:var(--accent);font-weight:700;text-decoration:none}

.guide{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}

.guide dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
.guide dt{font-weight:700}
.guide dd{margin:0;color:var(--muted)}
.note{font-size:.78rem;color:var(--muted);margin:0}

function mapUrl(a){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)}

let manual=false;
let favs=[];try{favs=JSON.parse(store.get('tk_favs')||'[]').map(String)}catch(e){favs=[]}
let view=store.get('tk_view')||(favs.length?'fav':'all');
function paintTabs(){document.querySelectorAll('#tabs .chip').forEach(c=>{c.setAttribute('aria-pressed',c.dataset.v===view);if(c.dataset.v==='fav')c.textContent='お気に入り'+(favs.length?'（'+favs.length+'）':'')})}
document.querySelectorAll('#tabs .chip').forEach(c=>c.onclick=()=>{view=c.dataset.v;store.set('tk_view',view);paintTabs();render()});
function toggleFav(id){id=String(id);favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store.set('tk_favs',JSON.stringify(favs));paintTabs();render()}
paintTabs();
function fillDates(){const t=todayYmd(),sel=$('day').value;$('day').innerHTML='';for(let k=0;k<40;k++){const y=addDays(t,k);const dm=Object.values(D.x||{}).map(x=>+x.month).filter(Boolean);const ok=+y.slice(5,7)===+t.slice(5,7)||dm.includes(+y.slice(5,7));if(!ok)break;const o=document.createElement('option');o.value=y;o.textContent=(k===0?'今日 ':k===1?'明日 ':'')+label(y)+(HOLI.includes(y)?' 祝':'');$('day').appendChild(o)}if(sel&&[...$('day').options].some(o=>o.value===sel))$('day').value=sel}
fillDates();

function pick(ymd,from){
 const free=$('free').checked;const day=wd(ymd),holi=HOLI.includes(ymd);
 return D.c.filter(c=>{const dj=D.dojos[c[0]];return c[1]===day+1&&c[5]===1&&!NG.test(c[4])&&c[2]>=from&&(view==='all'||favs.includes(String(c[0])))&&(free||!/自由練習/.test(c[4]))&&!(holi&&c[2]>='18:00')&&!/無料体験限定/.test(c[4])})
  .sort((a,b)=>a[2]<b[2]?-1:a[2]>b[2]?1:here?km(here,D.dojos[a[0]].g)-km(here,D.dojos[b[0]].g):D.dojos[a[0]].n.localeCompare(D.dojos[b[0]].n,'ja'));
}
function cardHTML(r,ymd){
 const dj=D.dojos[r[0]],n=r[4],off=r[8]&&r[8]===ymd;
 const md=+ymd.slice(5,7)+'/'+(+ymd.slice(8,10));
 const nt=((D.x&&D.x[r[0]]&&D.x[r[0]].notes)||[]).filter(x=>new RegExp('(^|[^0-9])'+md.replace('/','\\s*/\\s*')+'([^0-9]|$)').test(x.b));
 const tags=['<span class="tag">'+kind(n)+'</span>','<span class="tag lv">'+LV[Math.min(3,Math.max(0,r[6]))]+'</span>'];
 if(/自由練習/.test(n))tags.push('<span class="tag free">自由練習</span>');
 return '<div class="top"><span class="dojo">'+esc(dj.n)+(here?' <span class="dist">'+fmtKm(km(here,dj.g))+'</span>':'')+'</span><span class="time">'+r[2]+'〜'+r[3]+'</span></div><div class="cn">'+(off?'<span class="off">休講</span> ':'')+esc(n)+'</div>'+nt.map(x=>'<div class="warn">'+esc(x.t)+'：'+esc(x.b)+'</div>').join('')+'<div class="tags">'+tags.join('')+'</div><div class="links"><a href="'+mapUrl(dj.a)+'" target="_blank" rel="noopener">地図</a><a href="'+dj.u+'" target="_blank" rel="noopener">時間割</a><button type="button" class="fav" data-id="'+r[0]+'" aria-pressed="'+favs.includes(String(r[0]))+'">'+(favs.includes(String(r[0]))?'♥ お気に入り':'♡ お気に入りに入れる')+'</button></div>';
}
let here=null;try{const h=JSON.parse(store.get('tk_here')||'null');if(h&&store.get('tk_near')==='1')here=h}catch(e){}
function km(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtKm(k){return k<1?'約'+Math.round(k*10)*100+'m':'約'+k.toFixed(1)+'km'}
function paintNear(t){const b=$('near');b.setAttribute('aria-pressed',!!here);b.textContent=t||(here?'📍 近い順（解除）':'📍 近い順')}
$('near').onclick=()=>{
 if(here){here=null;store.set('tk_near','0');paintNear();render();return}
 if(!navigator.geolocation){paintNear('位置情報が使えません');return}
 paintNear('📍 現在地を確認中…');
 navigator.geolocation.getCurrentPosition(p=>{here=[p.coords.latitude,p.coords.longitude];store.set('tk_here',JSON.stringify(here));store.set('tk_near','1');paintNear();render()},
  ()=>{paintNear('位置情報が許可されていません');setTimeout(()=>paintNear(),3000)},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})};
// refresh a remembered position quietly on load
if(here&&navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{here=[p.coords.latitude,p.coords.longitude];store.set('tk_here',JSON.stringify(here));render()},()=>{},{timeout:10000,maximumAge:300000});
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
 const n=jstNow();$('nowLabel').textContent='いま '+DAYS[n.d]+'曜 '+n.t;
 const ymd=$('day').value||todayYmd(),from=$('from').value||'00:00';
 const isToday=ymd===todayYmd()&&!manual;
 let rows=pick(ymd,from);
 const hero=$('hero');const out=$('out');out.innerHTML='';
 if(HOLI.includes(ymd)){const h=document.createElement('div');h.className='holi';h.textContent=(+ymd.slice(5,7))+'/'+(+ymd.slice(8,10))+'は祝日なので、多くの店舗が18時までです。18時以降のクラスは外しています。';out.appendChild(h)}
 if(!rows.length){
  hero.hidden=false;hero.className='hero none';
  // look ahead to the next day that has classes
  let nd=addDays(ymd,1),nr=pick(nd,'00:00'),k=1;while(!nr.length&&k<7){nd=addDays(nd,1);nr=pick(nd,'00:00');k++}
  hero.innerHTML='<span class="k">'+(isToday?'今日はもう終わりました':'この時間からのクラスはありません')+'</span><span class="what">'+(nr.length?(label(nd)+'は '+nr[0][2]+' からあります'):'条件を変えてみてください')+'</span>'+(nr.length?'<div class="acts"><a href="#" id="jump">'+label(nd)+'を見る</a></div>':'');
  hero.style.background='';
  const j=$('jump');if(j)j.onclick=e=>{e.preventDefault();manual=true;if(![...$('day').options].some(o=>o.value===nd)){const o=document.createElement('option');o.value=nd;o.textContent=label(nd);$('day').appendChild(o)}$('day').value=nd;$('from').value='00:00';render()};
  out.innerHTML=(view==='fav'&&!favs.length)?'<div class="empty">まだお気に入りがありません。「すべての店舗」で、よく行く店舗の「♡ お気に入りに入れる」を押してください。<button class="ghost" type="button" id="allA">すべての店舗を見る</button></div>':'<div class="empty">'+(view==='fav'?'お気に入りの店舗には、':'')+'この時間から始まる初心者向けクラスがありません。'+(view==='fav'?'<button class="ghost" type="button" id="allA">すべての店舗で探す</button>':'')+'</div>';
  if(view==='fav'&&!favs.length)hero.hidden=true;
  const b=$('allA');if(b)b.onclick=()=>{document.querySelector('#tabs .chip').click()};
  return}
 const first=rows[0],dj=D.dojos[first[0]],diff=mins(first[2])-mins(n.t);
 const sameT=rows.filter(r=>r[2]===first[2]).length;
 hero.hidden=true;
 if(0)hero.innerHTML='<span class="k">'+(isToday?'次に始まるクラス':label(ymd)+' 最初のクラス')+'</span><span class="when">'+first[2]+(isToday?'<small>'+until(diff)+'</small>':'')+'</span><span class="what">'+esc(dj.n)+'　'+esc(first[4])+'</span><span class="where">'+esc(dj.a)+(sameT>1?'<br>同じ時間にほか'+(sameT-1)+'件あります':'')+'</span><div class="acts"><a href="'+mapUrl(dj.a)+'" target="_blank" rel="noopener">地図をひらく</a><a href="'+dj.u+'" target="_blank" rel="noopener">時間割</a></div>';
 const groups={};rows.forEach(r=>(groups[r[2]]=groups[r[2]]||[]).push(r));
 const f=document.createDocumentFragment();
 for(const t of Object.keys(groups)){
  const g=document.createElement('section');g.className='group';
  const d=mins(t)-mins(n.t);
  g.innerHTML='<div class="gh"><span class="t">'+t+'</span>'+(isToday?'<span class="in'+(d<=20?' soon':'')+'">'+until(d)+'</span>':'')+'<span class="cnt">'+groups[t].length+'件</span></div>';
  groups[t].forEach(r=>{const c=document.createElement('article');c.className='card';c.innerHTML=cardHTML(r,ymd);if(r[8]&&r[8]===ymd)c.classList.add('is-off');g.appendChild(c)});
  f.appendChild(g)}
 out.appendChild(f);out.insertBefore(Object.assign(document.createElement('div'),{className:'upd',textContent:'公式の時間割を '+(D.updated||'').slice(5).replace('-','/')+' に確認'}),out.firstChild);
 out.querySelectorAll('.fav').forEach(b=>b.onclick=()=>toggleFav(b.dataset.id));
}
function setNow(){const n=jstNow();fillDates();$('day').value=todayYmd();$('from').value=n.t;manual=false;render()}
$('toggleOpts').onclick=()=>{const o=$('opts');o.hidden=!o.hidden;$('toggleOpts').setAttribute('aria-expanded',!o.hidden);barh()};
['day','from'].forEach(id=>$(id).addEventListener('change',()=>{manual=true;render()}));
['free'].forEach(id=>$(id).addEventListener('change',render));
$('reset').onclick=setNow;
function barh(){document.documentElement.style.setProperty('--barh',$('bar').offsetHeight+'px')}
barh();addEventListener('resize',barh);paintNear();
setNow();
function refresh(){fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.c&&j.c.length){D=j;render()}}).catch(()=>{})}
refresh();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>{if(!manual){const n=jstNow();fillDates();$('day').value=todayYmd();$('from').value=n.t}render()},60000);
</script>
</body>
</html>
