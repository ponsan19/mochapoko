<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9cc7dd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぴっちゃかお得帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ぴっちゃかお得帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app — hero total card, recent list, fixed bottom tab bar with a centered add button */
:root{
  --hue-bg:#eef4f7; --hue:#7fb3cf; --hue-deep:#2f6f8f; --hue-soft:#d7e8f1;
  --bg:#f6f8f9; --surface:#ffffff; --fg:#23313a; --muted:#6f7f89; --line:#e2e8ec;
  --plus:#d9722b; --danger:#c2453b;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1e; --surface:#1d252a; --fg:#e6edf1; --muted:#95a5ae; --line:#2c373e;
  --hue-soft:#23343d; --plus:#f0a066; --danger:#ef7d72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1e; --surface:#1d252a; --fg:#e6edf1; --muted:#95a5ae; --line:#2c373e;
  --hue-soft:#23343d; --plus:#f0a066; --danger:#ef7d72; color-scheme:dark}

html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hue-deep);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px 12px}
.logo{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.04em;color:var(--hue-deep)}
.logo small{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px;letter-spacing:.08em}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--hue-soft);color:var(--hue-deep);display:grid;place-items:center;font-family:var(--display);font-weight:900;border:0}

.hero{background:var(--hue);border-radius:22px;padding:20px 20px 16px;color:#16323f;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.22)}
.hero .label{font-size:13px;font-weight:700;opacity:.8}
.hero .total{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,54px);line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.hero .sub{font-family:var(--display);font-weight:700;font-size:15px}
.stats{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{flex:1;background:rgba(255,255,255,.65);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:baseline}
.stat b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}

.sample{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between}
.sample button{border:0;background:none;color:var(--hue-deep);font-weight:700;white-space:nowrap}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:24px;margin-bottom:6px}
.sec-head h2{font-family:var(--display);font-size:17px;margin:0}
.link{border:0;background:none;color:var(--muted);font-size:13px}

.list{background:var(--surface);border-radius:16px;padding-inline:14px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;background:var(--hue-soft);display:grid;place-items:center;font-size:19px}
.item .t{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.item .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .amt{font-family:var(--display);font-weight:900;color:var(--plus);font-variant-numeric:tabular-nums;text-align:right}
.item .del{display:block;margin-top:4px;margin-left:auto;border:0;background:none;color:var(--muted);font-size:11px;padding:2px 0}
.tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:6px;background:var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}

/* history */
.bars{background:var(--surface);border-radius:16px;padding:16px 14px 10px}
.bars svg{width:100%;height:auto;display:block}
.month-row{display:flex;justify-content:space-between;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);width:100%;border-inline:0;border-top:0;background:none;text-align:left}
.month-row:last-child{border-bottom:0}
.month-row b{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--plus)}
.month-row .n{font-size:12px;color:var(--muted);margin-left:8px}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px}
.pager .mt{font-family:var(--display);font-weight:900;font-size:18px}
.pager .ms{font-size:13px;color:var(--muted);text-align:center}

/* settings */
.card{background:var(--surface);border-radius:16px;padding:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:2px solid transparent;border-radius:12px;padding:12px 4px;font-size:13px;font-weight:700;color:#23313a}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--hue-deep);color:#fff;width:100%}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:12px;color:var(--muted)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;padding:8px 16px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.tab[aria-current="page"]{color:var(--hue-deep);font-weight:700}
.tab svg{width:22px;height:22px}
.addbtn{border:0;border-radius:999px;background:var(--hue);color:#16323f;font-family:var(--display);font-weight:900;font-size:16px;padding:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;box-sizing:border-box}
.sheet h3{font-family:var(--display);font-size:19px;margin:0 0 12px}
.amount-in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:6px 14px;background:var(--bg)}
.amount-in span{font-family:var(--display);font-weight:900;font-size:26px;color:var(--plus)}
.amount-in input{border:0;background:none;font-family:var(--display);font-weight:900;font-size:30px;width:100%;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--hue-soft);border-color:var(--hue-deep);color:var(--hue-deep);font-weight:700}
.err{color:var(--danger);font-size:13px;min-height:1em}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo">ぴっちゃかお得帳<small>PICCHAKA</small></div>
    <button class="avatar" id="avatarBtn" aria-label="設定を開く">う</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in">
  <button class="tab" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button class="addbtn" id="addBtn">＋ ういた！</button>
  <button class="tab" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>履歴</button>
</div></nav>

<div id="sheetRoot"></div>

<script>
(function(){
const KEY="uitacho.v1";
const THEMES={
  sora:{name:"空",hue:"#9cc7dd",deep:"#2f6f8f"},
  wakaba:{name:"若葉",hue:"#b5d6a7",deep:"#3f7a37"},
  mikan:{name:"みかん",hue:"#f5c19b",deep:"#b35a1c"},
  lemon:{name:"レモン",hue:"#f1dd8e",deep:"#8a6d0b"},
  sakura:{name:"桜",hue:"#f1bfcf",deep:"#a83c62"},
  sumire:{name:"すみれ",hue:"#c8bfe6",deep:"#5a4a9c"}
};
const CATS=[
  {id:"gaman",label:"がまんした",icon:"🙅"},
  {id:"waribiki",label:"割引・クーポン",icon:"🏷️"},
  {id:"jisui",label:"自炊した",icon:"🍙"},
  {id:"aruki",label:"歩いた・自転車",icon:"🚲"},
  {id:"mizu",label:"水筒・持参",icon:"🥤"},
  {id:"other",label:"その他",icon:"✨"}
];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[5];

// ---------- storage (safe) ----------
let mem=null;
function load(){
  try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){}
  return mem;
}
function save(){
  mem=state;
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function sampleRecords(){
  const now=new Date(), r=[];
  const mk=(dAgo,h,title,memo,amount,cat)=>{const d=new Date(now);d.setDate(d.getDate()-dAgo);d.setHours(h,Math.floor(Math.random()*50),0,0);
    r.push({id:uid(),title,memo,amount,cat,at:d.toISOString(),sample:true});};
  mk(0,20,"ハンドクリーム買うの我慢した","家にまだあった",680,"gaman");
  mk(1,8,"自販機のかわりに水筒","だいたい150円くらい",150,"mizu");
  mk(2,19,"ラーメンのトッピングなしにした","十分おいしかった",120,"gaman");
  mk(3,12,"ランチをお弁当にした","",700,"jisui");
  mk(5,18,"ドラッグストアのクーポン使えた","洗剤10%オフ",58,"waribiki");
  mk(33,21,"コンビニスイーツ我慢","",298,"gaman");
  mk(40,9,"一駅歩いた","",170,"aruki");
  mk(62,13,"セールで買った","定価との差額",1200,"waribiki");
  return r;
}
let state=load()||{name:"",theme:"sora",records:sampleRecords(),v:1};
save();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const mkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDate(iso){
  const d=new Date(iso),n=new Date();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(d.toDateString()===n.toDateString()) return "今日 "+hm;
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(d.toDateString()===y.toDateString()) return "昨日 "+hm;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
const sorted=()=>[...state.records].sort((a,b)=>b.at.localeCompare(a.at));
const inMonth=(k)=>state.records.filter(r=>mkey(new Date(r.at))===k);
const sum=a=>a.reduce((s,r)=>s+Number(r.amount||0),0);
const hasSample=()=>state.records.some(r=>r.sample);

function applyTheme(){
  const t=THEMES[state.theme]||THEMES.sora, root=document.documentElement.style;
  root.setProperty("--hue",t.hue); root.setProperty("--hue-deep",t.deep);
  root.setProperty("--hue-soft",t.hue+"55");
  $("#avatarBtn").textContent=(state.name||"う").slice(0,1);
}
function toast(msg){
  const el=document.createElement("div");el.className="toast";el.textContent=msg;el.setAttribute("role","status");
  document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
}

// ---------- views ----------
let tab="home", histMonth=null, confirmDel=null;

function itemHTML(r){
  const c=catOf(r.cat);
  const armed=confirmDel===r.id;
  return `<div class="item">
    <div class="ico" aria-hidden="true">${c.icon}</div>
    <div style="min-width:0">
      <div class="t">${esc(r.title)}${r.sample?'<span class="tag">サンプル</span>':''}</div>
      ${r.memo?`<div class="m">${esc(r.memo)}</div>`:""}
      <div class="d">${fmtDate(r.at)}</div>
    </div>
    <div><div class="amt">+${yen(r.amount)}</div>
      <button class="del" data-del="${r.id}" ${armed?'style="color:var(--danger);font-weight:700"':''}>${armed?"本当に消す":"削除"}</button></div>
  </div>`;
}

function renderHome(){
  const now=new Date(), k=mkey(now);
  const month=inMonth(k);
  const today=month.filter(r=>new Date(r.at).toDateString()===now.toDateString());
  const recent=sorted().slice(0,8);
  $("#view").innerHTML=`
    <section class="hero" aria-label="今月の合計">
      <div class="label">${now.getMonth()+1}月${state.name?"・"+esc(state.name)+"さん":""}</div>
      <div class="total">${yen(sum(month))}</div>
      <div class="sub">ういた！</div>
      <div class="stats">
        <div class="stat">今月<b>${month.length}<small style="font-size:11px"> 回</small></b></div>
        <div class="stat">今日<b>+${yen(sum(today))}</b></div>
      </div>
    </section>
    ${hasSample()?`<div class="sample"><span>いま表示しているのはサンプルです。最初の記録を追加すると自動で消えます。</span><button id="clearSample">今すぐ消す</button></div>`:""}
    <div class="sec-head"><h2>最近の記録</h2><button class="link" data-go="history">月別の履歴 ›</button></div>
    <div class="list">${recent.length?recent.map(itemHTML).join(""):`<div class="empty">まだ記録がありません。<br>下の「＋ ういた！」から、我慢できたことや割引で浮いた金額を記録しましょう。</div>`}</div>
    ${state.records.length>8?`<p class="note" style="text-align:center">すべての記録は「履歴」から見られます</p>`:""}
  `;
}

function renderHistory(){
  const now=new Date();
  if(!histMonth) histMonth=mkey(now);
  // last 6 months bars
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(mkey(d));}
  const vals=months.map(m=>sum(inMonth(m)));
  const max=Math.max(1,...vals);
  const W=320,H=150,top=22,bottom=24,bw=30,gap=(W-bw*6)/6;
  const bars=months.map((m,i)=>{
    const h=Math.round((H-top-bottom)*vals[i]/max), x=gap/2+i*(bw+gap), y=H-bottom-h;
    const sel=m===histMonth;
    return `<g>
      <rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,2)}" rx="6" fill="${sel?"var(--hue-deep)":"var(--hue)"}"/>
      ${vals[i]?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${vals[i]>=10000?(vals[i]/10000).toFixed(1)+"万":vals[i].toLocaleString()}</text>`:""}
      <text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="${sel?"var(--fg)":"var(--muted)"}" font-weight="${sel?700:400}">${Number(m.slice(5))}月</text>
      <rect x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" fill="transparent" data-month="${m}" style="cursor:pointer"/>
    </g>`;}).join("");
  const [y,mo]=histMonth.split("-").map(Number);
  const list=inMonth(histMonth).sort((a,b)=>b.at.localeCompare(a.at));
  const catTotals=CATS.map(c=>({c,v:sum(list.filter(r=>r.cat===c.id))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  $("#view").innerHTML=`
    <div class="sec-head" style="margin-top:8px"><h2>この半年</h2><span class="note">棒をタップで月を切り替え</span></div>
    <div class="bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近6か月のういた金額">${bars}</svg></div>
    <div class="pager">
      <button id="prevM" aria-label="前の月">‹</button>
      <div><div class="mt" style="text-align:center">${y}年${mo}月 <span style="color:var(--plus)">${yen(sum(list))}</span></div>
      <div class="ms">${list.length}回 記録</div></div>
      <button id="nextM" aria-label="次の月" ${histMonth>=mkey(now)?"disabled style='opacity:.35'":""}>›</button>
    </div>
    ${catTotals.length?`<div class="chips" style="margin-top:12px">${catTotals.map(x=>`<span class="chip">${x.c.icon} ${x.c.label} <b style="font-variant-numeric:tabular-nums">${yen(x.v)}</b></span>`).join("")}</div>`:""}
    <div class="list" style="margin-top:12px">${list.length?list.map(itemHTML).join(""):`<div class="empty">この月の記録はありません</div>`}</div>
    <div class="sec-head"><h2>ぜんぶの合計</h2></div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:baseline"><span>これまでにういたお金</span><b style="font-family:var(--display);font-size:22px;color:var(--plus);font-variant-numeric:tabular-nums">${yen(sum(state.records))}</b></div>
  `;
}

function renderSettings(){
  $("#view").innerHTML=`
    <div class="sec-head" style="margin-top:8px"><h2>マイページ</h2></div>
    <div class="card stack">
      <div class="field"><label for="nameIn">ニックネーム</label><input id="nameIn" maxlength="20" placeholder="例：りく" value="${esc(state.name)}"></div>
      <div class="field"><label>テーマカラー</label>
        <div class="swatches">${Object.entries(THEMES).map(([k,t])=>`<button class="sw" data-theme-pick="${k}" aria-pressed="${state.theme===k}" style="background:${t.hue}">${t.name}${state.theme===k?" ✓":""}</button>`).join("")}</div>
      </div>
    </div>
    <div class="sec-head"><h2>データの引っ越し</h2></div>
    <div class="card stack">
      <p class="note" style="margin:0">記録はこの端末のこのブラウザだけに保存されています。機種変更や、あとで共有版に移すときは、下のボタンでデータをコピーして、移行先に貼り付けてください。</p>
      <button class="btn ghost" id="exportBtn">データをコピー</button>
      <div class="field"><label for="importIn">データを貼り付けて読み込む</label><textarea id="importIn" rows="3" placeholder="コピーしたデータをここに貼り付け"></textarea></div>
      <button class="btn ghost" id="importBtn">読み込む（今のデータに追加）</button>
      <div class="err" id="ioMsg"></div>
    </div>
    <div class="sec-head"><h2>リセット</h2></div>
    <div class="card stack">
      <button class="btn danger" id="resetBtn">${confirmDel==="__all"?"もう一度押すと全記録を削除します":"すべての記録を削除"}</button>
    </div>
  `;
}

function render(){
  applyTheme();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  if(tab==="home") renderHome(); else if(tab==="history") renderHistory(); else renderSettings();
}

// ---------- add sheet ----------
function openSheet(){
  let cat="gaman";
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><form class="sheet stack" id="addForm" novalidate>
    <h3>いくらういた？</h3>
    <div class="amount-in"><span>¥</span><input id="amtIn" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off" aria-label="金額"></div>
    <div class="chips">${[20,50,100,300,500,1000].map(v=>`<button type="button" class="chip" data-quick="${v}">+${v}</button>`).join("")}</div>
    <div class="field"><label>どうやって？</label><div class="chips" id="catChips">${CATS.map(c=>`<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id===cat}">${c.icon} ${c.label}</button>`).join("")}</div></div>
    <div class="field"><label for="titleIn">なにをした？</label><input id="titleIn" maxlength="40" placeholder="例：自販機で水を買うのを我慢した"></div>
    <div class="field"><label for="memoIn">ひとこと（任意）</label><input id="memoIn" maxlength="60" placeholder="例：水筒を持ってきてよかった"></div>
    <div class="err" id="formErr"></div>
    <button class="btn" type="submit">記録する</button>
    <button class="btn ghost" type="button" id="cancelBtn">やめる</button>
  </form></div>`;
  const amt=$("#amtIn");
  setTimeout(()=>amt.focus(),50);
  $("#scrim").addEventListener("click",e=>{
    if(e.target.id==="scrim"||e.target.id==="cancelBtn"){closeSheet();return;}
    const q=e.target.closest("[data-quick]"); if(q){amt.value=String((Number(amt.value.replace(/\D/g,""))||0)+Number(q.dataset.quick));return;}
    const c=e.target.closest("[data-cat]"); if(c){cat=c.dataset.cat;document.querySelectorAll("#catChips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===cat));}
  });
  amt.addEventListener("input",()=>{amt.value=amt.value.replace(/[^\d]/g,"").slice(0,7);});
  $("#addForm").addEventListener("submit",e=>{
    e.preventDefault();
    const n=Number(amt.value);
    if(!n||n<1){$("#formErr").textContent="金額を1円以上で入力してください";amt.focus();return;}
    const title=$("#titleIn").value.trim()||catOf(cat).label;
    if(hasSample()) state.records=state.records.filter(r=>!r.sample);
    state.records.push({id:uid(),title,memo:$("#memoIn").value.trim(),amount:n,cat,at:new Date().toISOString()});
    save();closeSheet();tab="home";render();toast("+"+yen(n)+" 記録しました");
  });
}
function closeSheet(){$("#sheetRoot").innerHTML="";}

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target;
  const go=t.closest("[data-tab],[data-go]"); if(go){tab=go.dataset.tab||go.dataset.go;confirmDel=null;render();window.scrollTo(0,0);return;}
  if(t.closest("#avatarBtn")){tab="settings";confirmDel=null;render();window.scrollTo(0,0);return;}
  if(t.closest("#addBtn")){openSheet();return;}
  const del=t.closest("[data-del]");
  if(del){const id=del.dataset.del;
    if(confirmDel===id){state.records=state.records.filter(r=>r.id!==id);confirmDel=null;save();render();toast("削除しました");}
    else{confirmDel=id;render();}
    return;}
  if(t.closest("#clearSample")){state.records=state.records.filter(r=>!r.sample);save();render();toast("サンプルを消しました");return;}
  const bm=t.closest("[data-month]"); if(bm){histMonth=bm.dataset.month;render();return;}
  if(t.closest("#prevM")||t.closest("#nextM")){
    const [y,m]=histMonth.split("-").map(Number);const d=new Date(y,m-1+(t.closest("#prevM")?-1:1),1);
    if(mkey(d)<=mkey(new Date())){histMonth=mkey(d);render();}return;}
  const tp=t.closest("[data-theme-pick]"); if(tp){state.theme=tp.dataset.themePick;save();render();return;}
  if(t.closest("#exportBtn")){
    const data=JSON.stringify({app:"uitacho",v:1,name:state.name,records:state.records.filter(r=>!r.sample)});
    const done=()=>{$("#ioMsg").style.color="var(--hue-deep)";$("#ioMsg").textContent="コピーしました。メモ帳などに貼って保管してください";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(done).catch(()=>fallbackCopy(data));}
    else fallbackCopy(data);
    return;}
  if(t.closest("#importBtn")){
    const msg=$("#ioMsg");
    try{
      const d=JSON.parse($("#importIn").value.trim());
      if(d.app!=="uitacho"||!Array.isArray(d.records)) throw 0;
      const ids=new Set(state.records.map(r=>r.id));
      const add=d.records.filter(r=>r&&r.id&&!ids.has(r.id)&&Number(r.amount)>0);
      state.records=state.records.filter(r=>!r.sample).concat(add);
      if(!state.name&&d.name) state.name=d.name;
      save();render();toast(add.length+"件 読み込みました");
    }catch(err){msg.style.color="var(--danger)";msg.textContent="読み込めませんでした。「データをコピー」で出した文字列をそのまま貼り付けてください";}
    return;}
  if(t.closest("#resetBtn")){
    if(confirmDel==="__all"){state.records=[];confirmDel=null;save();render();toast("すべて削除しました");}
    else{confirmDel="__all";render();}
    return;}
  if(confirmDel && !t.closest(".sheet")){confirmDel=null;render();}
});
function fallbackCopy(text){
  const ta=$("#importIn");ta.value=text;ta.focus();ta.select();
  $("#ioMsg").style.color="var(--muted)";$("#ioMsg").textContent="自動コピーできなかったので、上の欄を長押しして「コピー」してください";
}
document.addEventListener("input",e=>{
  if(e.target.id==="nameIn"){state.name=e.target.value.trim();save();applyTheme();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

render();
})();
</script>

</body>
</html>
