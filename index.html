<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぴっちゃかお得帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<title>ぴっちゃかお得帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app — hero total card, recent list, fixed bottom tab bar with a centered add button */
:root{
  --hue-bg:#eef4f7; --hue:#7fb3cf; --hue-deep:#2f6f8f; --hue-soft:#d7e8f1;
  --bg:#f6f8f9; --surface:#ffffff; --fg:#23313a; --muted:#6f7f89; --line:#e2e8ec;
  --plus:#d9722b; --danger:#c2453b;
  --display:"Zen Maru Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1e; --surface:#1d252a; --fg:#e6edf1; --muted:#95a5ae; --line:#2c373e;
  --hue-soft:#23343d; --plus:#f0a066; --danger:#ef7d72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1e; --surface:#1d252a; --fg:#e6edf1; --muted:#95a5ae; --line:#2c373e;
  --hue-soft:#23343d; --plus:#f0a066; --danger:#ef7d72; color-scheme:dark}

html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hue-deep);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px 12px}
.logo{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.04em;color:var(--hue-deep)}
.logo small{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px;letter-spacing:.08em}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--hue-soft);color:var(--hue-deep);display:grid;place-items:center;font-family:var(--display);font-weight:900;border:0}

.hero{background:var(--hue);border-radius:22px;padding:20px 20px 16px;color:#16323f;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.22)}
.hero .label{font-size:13px;font-weight:700;opacity:.8}
.hero .total{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,54px);line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.hero .sub{font-family:var(--display);font-weight:700;font-size:15px}
.stats{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{flex:1;background:rgba(255,255,255,.65);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:baseline}
.stat b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}

.sample{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between}
.sample button{border:0;background:none;color:var(--hue-deep);font-weight:700;white-space:nowrap}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:24px;margin-bottom:6px}
.sec-head h2{font-family:var(--display);font-size:17px;margin:0}
.link{border:0;background:none;color:var(--muted);font-size:13px}

.list{background:var(--surface);border-radius:16px;padding-inline:14px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;background:var(--hue-soft);display:grid;place-items:center;font-size:19px}
.item .t{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.item .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .amt{font-family:var(--display);font-weight:900;color:var(--plus);font-variant-numeric:tabular-nums;text-align:right}
.item .del{display:block;margin-top:4px;margin-left:auto;border:0;background:none;color:var(--muted);font-size:11px;padding:2px 0}
.tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:6px;background:var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}

/* history */
.bars{background:var(--surface);border-radius:16px;padding:16px 14px 10px}
.bars svg{width:100%;height:auto;display:block}
.month-row{display:flex;justify-content:space-between;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);width:100%;border-inline:0;border-top:0;background:none;text-align:left}
.month-row:last-child{border-bottom:0}
.month-row b{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--plus)}
.month-row .n{font-size:12px;color:var(--muted);margin-left:8px}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px}
.pager .mt{font-family:var(--display);font-weight:900;font-size:18px}
.pager .ms{font-size:13px;color:var(--muted);text-align:center}

/* settings */
.card{background:var(--surface);border-radius:16px;padding:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.sheet .field > label{font-family:var(--display);font-size:15px;font-weight:900;letter-spacing:.02em;-webkit-text-stroke:.3px currentColor}
.cat-edit-row{display:flex;align-items:center;gap:8px}
.cat-edit-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.cat-edit-row button{border:0;background:var(--hue-soft);border-radius:10px;padding:9px 12px;color:var(--hue-deep);font-weight:700;white-space:nowrap}
.cat-edit-row button.remove{background:none;color:var(--muted);padding-inline:3px}
.cat-edit-row :disabled{opacity:.48;cursor:not-allowed}
.profile-picker{display:flex;align-items:center;gap:15px;padding-block:4px}
.profile-preview{width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--hue-soft);color:var(--hue-deep);font-family:var(--display);font-size:28px;font-weight:900}
.profile-controls{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.profile-controls .note{margin:0}
.photo-pick{display:inline-block;cursor:pointer;border-radius:12px;padding:9px 14px;background:var(--hue-soft);color:var(--hue-deep);font-weight:700;font-size:13px}
.photo-pick:focus-within{outline:2px solid var(--hue-deep);outline-offset:2px}
.remove-photo{border:0;background:none;color:var(--muted);padding:3px 0;font-size:12px;text-decoration:underline}
.avatar img,.profile-preview img{width:100%;height:100%;object-fit:cover;display:block}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--hue-deep);color:#fff;width:100%}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:12px;color:var(--muted)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;padding:8px 16px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.tab[aria-current="page"]{color:var(--hue-deep);font-weight:900}
.tab svg{width:22px;height:22px}
.addbtn{border:0;border-radius:999px;background:var(--hue);color:#16323f;font-family:var(--display);font-weight:900;font-size:16px;padding:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;box-sizing:border-box}
.sheet h3{font-family:var(--display);font-size:19px;margin:0 0 12px}
.amount-in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:6px 14px;background:var(--bg)}
.amount-in span{font-family:var(--display);font-weight:900;font-size:26px;color:var(--plus)}
.amount-in input{border:0;background:none;font-family:var(--display);font-weight:900;font-size:30px;width:100%;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--hue-soft);border-color:var(--hue-deep);color:var(--hue-deep);font-weight:700}
.cat-art{display:inline-block;width:29px;height:29px;flex:none;vertical-align:-8px;border-radius:7px;background-size:100% 300%;background-repeat:no-repeat;background-color:#e4f5fb}
.ico .cat-art{width:42px;height:42px;border-radius:15px}
.chip .cat-art{margin-right:5px}

.art-1,.art-4{background-position:center 50%}
.art-2,.art-5{background-position:center 100%}
.err{color:var(--danger);font-size:13px;min-height:1em}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}

/* ぴっちゃかのやさしい、まるい水色 */
:root{
  --hue-bg:#f4fbff;--hue:#a9daf0;--hue-deep:#28799b;--hue-soft:#e4f5fb;
  --bg:#f4fbff;--surface:#ffffff;--fg:#21394a;--muted:#6f8796;
  --line:#dbeef5;--plus:#267f9f;--danger:#b44b59;
  --shadow:0 10px 28px rgba(47,111,143,.09);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#172831;--surface:#203640;--fg:#eefaff;--muted:#afc9d6;
  --line:#36515d;--hue-soft:#294e61;--plus:#9cdef2;--shadow:0 12px 28px rgba(0,0,0,.18);
}}
:root[data-theme="dark"]{
  --bg:#172831;--surface:#203640;--fg:#eefaff;--muted:#afc9d6;
  --line:#36515d;--hue-soft:#294e61;--plus:#9cdef2;--shadow:0 12px 28px rgba(0,0,0,.18);
}
body{
  background:radial-gradient(circle at 12% 8%,rgba(163,220,244,.23),transparent 30%),
             radial-gradient(circle at 95% 40%,rgba(208,240,250,.27),transparent 28%),var(--bg);
}
.app{padding-inline:20px;padding-bottom:138px}
header.top{padding-block:24px 18px;gap:12px}
.logo{font-size:21px;line-height:1.25;letter-spacing:.015em;color:var(--hue-deep)}
.logo::before{content:"✿";display:inline-grid;place-items:center;width:26px;height:26px;
  margin-right:7px;border-radius:10px;background:var(--hue-soft);font-size:16px;vertical-align:3px}
.logo small{display:block;margin-left:35px;margin-top:2px;font-size:9px;letter-spacing:.2em;color:var(--muted)}
.avatar{width:44px;height:44px;flex:none;background:var(--surface);border:2px solid var(--hue-soft);
  box-shadow:0 4px 12px rgba(47,111,143,.13);color:var(--hue-deep);font-size:18px;overflow:hidden;padding:0}
.hero{min-height:236px;padding:24px 22px 20px;border-radius:30px;
  background:linear-gradient(145deg,var(--hue-soft) 0%,var(--hue) 100%);
  color:#23475b;box-shadow:0 15px 30px rgba(47,111,143,.16)}
.hero::before{content:"✦  ✿";position:absolute;right:24px;top:16px;color:rgba(255,255,255,.8);
  font-size:23px;letter-spacing:9px;transform:rotate(-9deg)}
.hero::after{right:-45px;top:32px;width:178px;height:178px;border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.13)}
.hero>*{position:relative;z-index:1}
.hero .label{display:inline-block;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.65);
  font-family:var(--display);font-size:12px;font-weight:900;opacity:1}
.hero .total{font-size:clamp(48px,15vw,68px);margin-top:18px;letter-spacing:-.035em}
.hero .sub{font-size:18px;margin-top:1px}
.stats{gap:9px;margin-top:22px}
.stat{min-height:54px;padding:10px 12px;border-radius:17px;background:rgba(255,255,255,.78);
  font-size:12px;color:#3e677b;box-shadow:0 3px 12px rgba(47,111,143,.05)}
.stat b{font-size:17px;color:#23475b}
.sample{margin-top:18px;border:1px dashed #a4cfe0;border-radius:18px;padding:13px 14px;
  background:var(--surface);box-shadow:var(--shadow);line-height:1.5}
.sample button{color:var(--hue-deep)}
.sec-head{align-items:center;margin-top:30px;margin-bottom:11px}
.sec-head h2{font-size:19px;letter-spacing:.02em}
.sec-head h2::before{content:none}
.link{color:var(--hue-deep);font-size:12px;font-weight:700}
.list,.card,.bars{border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.list{padding-inline:16px}
.item{grid-template-columns:42px minmax(0,1fr) auto;gap:10px;padding-block:15px}
.ico{width:42px;height:42px;border-radius:15px;background:var(--hue-soft);font-size:21px}
.item .t{display:block;font-family:var(--display);font-weight:900;font-size:15px;line-height:1.5;color:var(--fg)}.item .amt{color:var(--plus);font-size:15px}
.tag{border-radius:999px;background:var(--hue-soft);color:var(--hue-deep);padding:2px 7px}
.empty{padding:32px 8px 35px;line-height:1.85}
.empty::before{content:"♡";display:block;font-family:var(--display);font-size:31px;color:var(--hue-deep);line-height:1.4}
.bars{padding:17px 14px 10px}.card{padding:20px}
.pager button{border-radius:14px;box-shadow:var(--shadow)}
.field input,.field textarea{border-radius:15px;background:var(--surface);padding:12px 14px}
.field input:focus,.field textarea:focus{border-color:var(--hue-deep);outline:none}
.btn{border-radius:16px;min-height:49px;box-shadow:0 5px 14px rgba(47,111,143,.1)}
.btn.ghost,.btn.danger{box-shadow:none}
nav.tabs{background:linear-gradient(180deg,transparent,var(--bg) 35%);border:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{padding:9px 10px;grid-template-columns:1fr 1.45fr 1fr;border:1px solid var(--line);
  border-radius:26px;background:var(--surface);box-shadow:0 12px 32px rgba(47,111,143,.15)}
.tab{min-height:48px;justify-content:center;font-size:11px;gap:0}
.tab svg{width:23px;height:23px}
.addbtn{min-height:50px;border-radius:17px;background:linear-gradient(120deg,var(--hue),var(--hue-soft));
  color:#23475b;font-size:16px;box-shadow:0 6px 14px rgba(47,111,143,.18)}
.scrim{background:rgba(22,46,58,.48)}
.sheet{border-radius:30px 30px 0 0;padding:29px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:99px;background:var(--line);margin:-16px auto 13px}
.sheet h3{font-size:22px}.amount-in{border-radius:18px;background:var(--surface);padding:9px 14px}
.chip{border-radius:999px;background:var(--surface);padding:8px 13px}
.chip[aria-pressed="true"]{background:var(--hue-soft);border-color:var(--hue-deep);color:var(--hue-deep)}
.toast{background:var(--hue-deep);color:#fff;box-shadow:0 8px 20px rgba(47,111,143,.2)}
/* 換算・目標・連続 */
.goal{margin-top:16px;border:0;background:none;padding:0;width:100%;text-align:left;color:inherit}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:#3e677b}
.goal-top b{font-family:var(--display);font-size:13px;color:#23475b;font-variant-numeric:tabular-nums}
.goal-bar{margin-top:6px;height:12px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hue-deep),#4fa3c4);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.goal.done .goal-bar i{background:linear-gradient(90deg,#4fa3c4,#7fd0e8)}
/* リスト：削除はタップで出す */
.item{cursor:pointer;border-radius:0}
.item .del{display:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-top:6px}
.item.open .del{display:block}
/* ごほうび演出 */
.cheer{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(22,46,58,.28);cursor:pointer;animation:fadeIn .25s ease-out}
.cheer-close{font-size:12px;font-weight:700;color:#fff;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.3)}
@keyframes fadeIn{from{background:rgba(22,46,58,0)}}
.cheer.out{animation:fadeOut .3s ease-in forwards}
@keyframes fadeOut{to{background:rgba(22,46,58,0)}}
.cheer-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.cheer-face{width:160px;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:22px;border:5px solid #fff;box-shadow:0 14px 30px rgba(47,111,143,.3)}
.cheer-bubble{position:relative;max-width:calc(100vw - 32px);background:#fff;color:#23475b;font-family:var(--display);font-weight:900;font-size:24px;border-radius:20px;padding:10px 18px;box-shadow:0 10px 26px rgba(47,111,143,.2);text-align:center;line-height:1.4}
.cheer-bubble::before{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.cheer-bubble small{display:block;font-size:13px;color:var(--hue-deep)}
.confetti{position:fixed;top:-20px;width:9px;height:14px;border-radius:3px;z-index:39;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .cheer-card{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .cheer.out .cheer-card{animation:fade .3s ease-in forwards}
  .cheer-face{animation:hop .6s .35s ease-out,bob 2.4s 1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:none}50%{transform:translateY(-6px) rotate(-2deg)}}
  .confetti{animation:fall var(--d,1.6s) var(--delay,0s) cubic-bezier(.3,.6,.5,1) forwards}
  .hero .total.bump{animation:bump .5s ease-out}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{to{transform:translateY(-14px);opacity:0}}
  @keyframes hop{0%,100%{transform:none}40%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
  @keyframes fall{to{transform:translate(var(--x,0),105vh) rotate(var(--r,540deg));opacity:.9}}
  @keyframes bump{40%{transform:scale(1.06)}}
}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.cheer.out{opacity:0;transition:opacity .3s}}
body{font-weight:500}
.note,.item .m,.item .d,.stat,.chip,.empty,.pager .ms,.field input,.field textarea{font-weight:500}
/* なかま・ガチャ */
.gacha-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.friends{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.friend{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--fg)}
.friend img{width:64px;height:84px;object-fit:cover;border-radius:16px;border:2px solid #fff;box-shadow:0 4px 10px rgba(47,111,143,.18)}
.friend .q{width:64px;height:84px;border-radius:18px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:26px;color:var(--muted);background:var(--bg)}
.friend.unknown span{color:var(--muted)}
.gacha-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tix{display:flex;flex-direction:column;min-width:0}
.tix b{font-family:var(--display);font-size:22px;color:var(--hue-deep);line-height:1.2}
.tix b small{font-size:12px}

  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(169,218,240,0)}80%{box-shadow:0 0 40px 18px rgba(169,218,240,.9)}100%{box-shadow:0 0 70px 30px rgba(255,255,255,1)}}

  @keyframes shake{0%{transform:none}8%{transform:rotate(-6deg)}16%{transform:rotate(6deg)}26%{transform:rotate(-9deg)}36%{transform:rotate(9deg)}44%{transform:rotate(-12deg)}52%{transform:rotate(12deg)}58%{transform:rotate(-15deg)}64%{transform:rotate(15deg)}70%{transform:rotate(-18deg) scale(1.04)}76%{transform:rotate(18deg) scale(1.06)}82%{transform:rotate(-10deg) scale(1.1)}88%{transform:rotate(10deg) scale(1.14)}94%,100%{transform:scale(1.22)}}
}

/* ステータスバー（時計・電池）の裏に文字が入り込まないようにする */

.sound-row{display:flex;justify-content:space-between;align-items:center;gap:12px}

.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .2s}

/* ===== 豪華ガチャ ===== */
.g-stage{position:fixed;inset:0;z-index:50;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 40%,#2b6f93 0%,#173d55 45%,#0c1f2e 100%)}
.g-stars{position:absolute;inset:0}
.g-stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2s ease-in-out infinite}
.g-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0deg 7deg,rgba(255,255,255,0) 7deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 55%);mask:radial-gradient(circle,#000 0%,transparent 55%);transition:opacity .4s}
.g-cap{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;cursor:pointer;outline:none;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.g-cap i{position:absolute;left:0;width:160px;height:80px;box-sizing:border-box;border:5px solid #fff}
.g-cap .cap-top{top:0;border-radius:80px 80px 0 0;border-bottom:0;background:radial-gradient(circle at 32% 30%,#e9f7fd 0 12%,#a9daf0 30%,#28799b 100%)}
.g-cap .cap-bottom{bottom:0;border-radius:0 0 80px 80px;border-top:0;background:radial-gradient(circle at 40% 20%,#fff 0%,#e4f5fb 60%,#bfe3f2 100%)}
.g-cap .cap-band{top:74px;height:12px;border:0;background:#fff;border-radius:6px}
.g-glint{position:absolute;left:30px;top:20px;width:34px;height:18px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-25deg)}
.g-hint{position:absolute;left:0;right:0;top:calc(50% + 110px);text-align:center;color:#fff;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.06em;opacity:0;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.g-card{position:absolute;left:50%;top:50%;width:min(300px,calc(100vw - 40px));transform:translate(-50%,-50%);perspective:1000px;opacity:0;pointer-events:none}
.g-flip{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.9,.3,1.2)}
.g-back,.g-front{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px}
.g-back{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:80px;color:#fff;
  background:linear-gradient(145deg,#a9daf0,#28799b);border:5px solid #fff}
.g-front{transform:rotateY(180deg);background:var(--surface);padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 24px 50px rgba(0,0,0,.35);position:relative}
.g-new{position:absolute;top:-12px;right:-8px;background:linear-gradient(135deg,#ffcf5a,#ff9d4d);color:#fff;font-family:var(--display);font-weight:900;font-size:14px;padding:5px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(255,150,60,.4);transform:rotate(8deg)}
.g-photo{position:relative;width:170px;aspect-ratio:3/4;border-radius:20px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 22px rgba(47,111,143,.25)}
.g-photo img{width:100%;height:100%;object-fit:cover;display:block}
.g-sweep{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 62%);transform:translateX(-120%)}
.g-no{margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}
.g-name{margin-top:10px;font-family:var(--display);font-weight:900;font-size:30px;color:var(--hue-deep);line-height:1.2}
.g-msg{font-family:var(--display);font-weight:900;font-size:17px;color:var(--fg);text-align:center}
/* 状態 */
.s-wait .g-hint{opacity:1}
.s-charge .g-rays,.s-burst .g-rays{opacity:1}
.s-burst .g-cap .cap-top{transform:translate(-40px,-160px) rotate(-40deg);opacity:0;transition:transform .45s ease-out,opacity .45s}
.s-burst .g-cap .cap-bottom{transform:translate(40px,160px) rotate(30deg);opacity:0;transition:transform .45s ease-out,opacity .45s}
.s-burst .g-cap .cap-band,.s-burst .g-glint,.s-reveal .g-cap,.s-reveal .g-hint{opacity:0}
.s-reveal .g-cap{display:none}
.s-reveal .g-rays{opacity:.8}
.s-reveal.is-empty .g-rays{opacity:0}
.s-reveal .g-card{opacity:1;pointer-events:auto}
.s-reveal .g-flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:no-preference){
  .s-drop .g-cap{animation:capDrop .9s cubic-bezier(.3,1.5,.5,1) both}
  .s-wait .g-cap{animation:wobble 1.1s ease-in-out infinite}
  .s-wait .g-hint{animation:hintPulse 1.1s ease-in-out infinite}
  .s-charge .g-cap{animation:charge .9s ease-in both}
  .s-charge .g-rays{animation:spin 6s linear infinite}
  .s-reveal .g-rays{animation:spin 14s linear infinite}
  .s-reveal .g-sweep{animation:sweep 1.2s .7s ease-in-out}
  .s-reveal .g-new{animation:newPop .5s .8s cubic-bezier(.2,1.6,.4,1) both}
  .s-reveal .g-name{animation:namePop .5s .75s cubic-bezier(.2,1.6,.4,1) both}
  .s-reveal .g-card{animation:cardIn .5s ease-out}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes capDrop{0%{transform:translateY(-80vh) rotate(-30deg)}70%{transform:translateY(0) rotate(8deg)}85%{transform:translateY(-18px) rotate(-4deg)}100%{transform:none}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  @keyframes hintPulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
  @keyframes charge{0%{transform:none;filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
    20%{transform:rotate(-10deg) scale(1.02)}30%{transform:rotate(10deg) scale(1.04)}40%{transform:rotate(-14deg) scale(1.06)}
    50%{transform:rotate(14deg) scale(1.08)}60%{transform:rotate(-18deg) scale(1.1)}70%{transform:rotate(18deg) scale(1.13)}
    80%{transform:rotate(-10deg) scale(1.16)}90%{transform:rotate(10deg) scale(1.2)}100%{transform:scale(1.28);filter:drop-shadow(0 0 40px #fff)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sweep{to{transform:translateX(120%)}}
  @keyframes newPop{from{transform:scale(0) rotate(8deg)}to{transform:scale(1) rotate(8deg)}}
  @keyframes namePop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  @keyframes cardIn{from{transform:translate(-50%,-50%) scale(.5)}to{transform:translate(-50%,-50%) scale(1)}}
}

/* ===================== あおときいろテーマ ===================== */
:root,:root:not([data-theme="light"]){--bg:#f6f8fb;--surface:#ffffff;--fg:#1b2a3a;--muted:#6f7c8a;--line:#e3e9f1;
  --hue:#9cc3ea;--hue-deep:#0e58a8;--hue-soft:#e6f0fa;--plus:#0e58a8;--yellow:#ffd400;--orange:#f47a20;--green:#3f9a3c;--ink:#1b2a3a;
  --shadow:0 4px 14px rgba(14,60,110,.07);color-scheme:light}
body{background:var(--bg)!important;color:var(--fg)}
.statusbar-cover{background:var(--bg)!important}
header.top{padding-block:12px 10px;transition:background .2s}

.avatar{background:#6fb4ea!important;border:3px solid #fff!important;box-shadow:0 3px 8px rgba(0,0,0,.12)!important}

body.on-gacha .statusbar-cover{background:var(--hue-deep)!important}

.hero-art{position:absolute;right:-4px;top:4px;width:96px;height:120px}

.gp-q .sp::before,.gp-q .sp::after{content:"";position:absolute;width:3px;height:12px;border-radius:2px;background:var(--hue-deep)}
.gp-q .sp.l::before{left:2px;transform:rotate(-30deg)}.gp-q .sp.l::after{left:9px;transform:rotate(-10deg)}
.gp-q .sp.r::before{left:2px;transform:rotate(10deg)}.gp-q .sp.r::after{left:9px;transform:rotate(30deg)}
.gp-btn{width:100%;min-height:62px;border-radius:999px;border:0;background:var(--yellow);color:#1b2a3a;font-family:var(--display);font-weight:900;font-size:24px;box-shadow:0 6px 0 #e0bb00,0 10px 20px rgba(0,0,0,.1)}
.gp-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e0bb00}
.gp-btn:disabled{background:#e3e9f1;color:var(--muted);box-shadow:none}
.gp-note{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.gp-btn:not(:disabled){animation:gpPulse 1.6s ease-in-out infinite}
  @keyframes gpPulse{0%,100%{transform:none}50%{transform:scale(1.03)}}}
/* ほかのページ */
.h-total{background:var(--hue-deep)!important;color:#fff!important;box-shadow:0 10px 22px rgba(14,88,168,.22)!important}
.h-total span{opacity:.9}
.list,.card,.bars,.zk{border-color:var(--line)!important}
.day-head b,.h-month-mid b{color:var(--hue-deep)!important}
.btn:not(.ghost):not(.danger){background:var(--hue-deep)!important}
.cheer-bubble{color:var(--fg)!important}
.cheer-bubble small{color:var(--hue-deep)!important}
.g-stage{background:radial-gradient(ellipse at 50% 40%,#2f7fd0 0%,#0e58a8 45%,#062a55 100%)!important}
.g-cap .cap-top{background:radial-gradient(circle at 32% 30%,#fff6b3 0 12%,#ffd400 40%,#e0a800 100%)!important}
.g-back{background:linear-gradient(145deg,#2f7fd0,#0e58a8)!important}
.g-name{color:var(--hue-deep)!important}
.g-new{background:linear-gradient(135deg,#ffd400,#f47a20)!important;color:#1b2a3a!important}
</style>

<script>
(function(){

const APP_VERSION="2026.10.01-2";
const KEY="uitacho.v1";
const MAX_CATS=6;

const usedIcons=new Set();
state.categories=state.categories.map(c=>{
  let iconIndex=Number.isInteger(c.iconIndex)&&c.iconIndex>=0&&c.iconIndex<MAX_CATS?c.iconIndex:DEFAULT_CATS.find(d=>d.id===c.id)?.iconIndex;
  if(iconIndex===undefined||usedIcons.has(iconIndex)) iconIndex=[0,1,2,3,4,5].find(i=>!usedIcons.has(i))??5;
  usedIcons.add(iconIndex);
  return {id:c.id,label:c.label,iconIndex};
});
for(const c of state.categories.slice(MAX_CATS)){state.categoryArchive[c.id]=c.label;state.categoryIconMap[c.id]=c.iconIndex;}
state.categories=state.categories.slice(0,MAX_CATS);
if(!state.categories.length) state.categories=[{...DEFAULT_CATS[5]}];
for(const c of state.categories){state.categoryIconMap[c.id]=c.iconIndex;if(c.id==="aruki"&&c.label==="歩いた・自転車")c.label="歩いた";}
if(state.categoryArchive.aruki==="歩いた・自転車")state.categoryArchive.aruki="歩いた";
for(const c of DEFAULT_CATS) if(state.categoryIconMap[c.id]===undefined) state.categoryIconMap[c.id]=c.iconIndex;
save();

if(!Array.isArray(state.owned)) state.owned=[];
if(!Number.isInteger(state.ticketsUsed)||state.ticketsUsed<0) state.ticketsUsed=0;
save();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const mkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime=iso=>{const d=new Date(iso);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const WD="日月火水木金土";
function fmtDay(d){const n=new Date(),y=new Date();y.setDate(n.getDate()-1);
  const base=(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）";
  if(d.toDateString()===n.toDateString()) return "今日 · "+base;
  if(d.toDateString()===y.toDateString()) return "昨日 · "+base;
  return base;}
function fmtDate(iso){
  const d=new Date(iso),n=new Date();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(d.toDateString()===n.toDateString()) return "今日 "+hm;
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(d.toDateString()===y.toDateString()) return "昨日 "+hm;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
const sorted=()=>[...state.records].sort((a,b)=>b.at.localeCompare(a.at));
const inMonth=(k)=>state.records.filter(r=>mkey(new Date(r.at))===k);
const sum=a=>a.reduce((s,r)=>s+Number(r.amount||0),0);
const hasSample=()=>state.records.some(r=>r.sample);

const realTotal=()=>sum(state.records.filter(r=>!r.sample));
const ticketsEarned=()=>1+Math.floor(realTotal()/TICKET_YEN);
const ticketsLeft=()=>Math.max(0,ticketsEarned()-state.ticketsUsed);
const toNextTicket=()=>TICKET_YEN-(realTotal()%TICKET_YEN);
const goalOf=()=>Number(state.goal)>0?Number(state.goal):3000;

function applyProfile(){
  for(const el of [$("#avatarBtn"),$("#profilePreview")]){
    if(!el) continue;
    if(typeof state.profileImage==="string" && /^data:image\/jpeg;base64,/.test(state.profileImage)){
      const img=document.createElement("img");
      img.src=state.profileImage;
      img.alt="";
      el.replaceChildren(img);

function toast(msg){
  const el=document.createElement("div");el.className="toast";el.textContent=msg;el.setAttribute("role","status");
  document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
}

// ---------- views ----------
let tab="home", histMonth=null, confirmDel=null, openId=null;

function itemHTML(r,timeOnly){
  const c=catOf(r.cat);
  const armed=confirmDel===r.id;
  return `<div class="item${openId===r.id||armed?" open":""}" data-item="${r.id}">
    <div class="ico" aria-hidden="true">${catIcon(r.cat)}</div>

      <strong class="t">${esc(r.title)}</strong>
      ${r.memo?`<div class="m">${esc(r.memo)}</div>`:""}

const CAT_COLORS=["#0e58a8","#ffd400","#f47a20","#3f9a3c","#6fa8dc","#6b4524"];
function renderHistory(){
  const now=new Date();
  if(!histMonth) histMonth=mkey(now);
  // グラフ：記録を付け始めた月から（最大6か月・最低3か月）
  const firstAt=state.records.length?new Date(state.records.reduce((m,r)=>r.at<m?r.at:m,state.records[0].at)):now;
  const diff=(now.getFullYear()-firstAt.getFullYear())*12+now.getMonth()-firstAt.getMonth();
  const span=Math.min(6,Math.max(3,diff+1));
  const months=[];for(let i=span-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(mkey(d));}
  const vals=months.map(m=>sum(inMonth(m)));
  const max=Math.max(1,...vals);
  const W=320,H=104,top=18,bottom=22,bw=Math.min(40,W/span*.5),gap=(W-bw*span)/span;
  const bars=months.map((m,i)=>{
    const h=Math.round((H-top-bottom)*vals[i]/max), x=gap/2+i*(bw+gap), yy=H-bottom-h;
    const sel=m===histMonth;
    return `<g>
      <rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(h,2)}" rx="6" fill="${sel?"var(--hue-deep)":"var(--hue)"}"/>
      ${vals[i]?`<text x="${x+bw/2}" y="${yy-5}" text-anchor="middle" font-size="10" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${vals[i]>=10000?(vals[i]/10000).toFixed(1)+"万":vals[i].toLocaleString()}</text>`:""}
      <text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="11" fill="${sel?"var(--fg)":"var(--muted)"}" font-weight="${sel?700:400}">${Number(m.slice(5))}月</text>
      <rect x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" fill="transparent" data-month="${m}" style="cursor:pointer"/>
    </g>`;}).join("");
  const [y,mo]=histMonth.split("-").map(Number);
  const list=inMonth(histMonth).sort((a,b)=>b.at.localeCompare(a.at));
  const mTotal=sum(list);
  const cats=[...new Set(list.map(r=>r.cat))].map(id=>({c:catOf(id),v:sum(list.filter(r=>r.cat===id))})).sort((a,b)=>b.v-a.v).map((x,i)=>({...x,color:CAT_COLORS[i%CAT_COLORS.length]}));
  // 日ごとにまとめる
  const days=[];for(const r of list){const k=new Date(r.at).toDateString();let g=days.find(d=>d.k===k);if(!g){g={k,d:new Date(r.at),rs:[]};days.push(g);}g.rs.push(r);}
  $("#view").innerHTML=`
    <section class="h-total">
      <span>これまでの合計</span>
      <b>${yen(sum(state.records))}</b>
    </section>
    <div class="h-month">
      <button id="prevM" aria-label="前の月">‹</button>
      <div class="h-month-mid"><span>${y}年${mo}月</span><b>${yen(mTotal)}</b></div>
      <button id="nextM" aria-label="次の月" ${histMonth>=mkey(now)?"disabled":""}>›</button>
    </div>
    <div class="bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月ごとの節約額">${bars}</svg></div>
    ${cats.length?`<div class="card h-cats">
      <div class="h-stack">${cats.map(x=>`<i style="width:${(x.v/mTotal*100).toFixed(2)}%;background:${x.color}"></i>`).join("")}</div>
      <ul>${cats.map(x=>`<li><span class="dot" style="background:${x.color}"></span>${esc(x.c.label)}<b>${yen(x.v)}</b><small>${Math.round(x.v/mTotal*100)}%</small></li>`).join("")}</ul>
    </div>`:""}
    ${days.length?days.map(g=>`<div class="day-head"><span>${fmtDay(g.d)}</span><b>+${yen(sum(g.rs))}</b></div>
      <div class="list">${g.rs.map(r=>itemHTML(r,true)).join("")}</div>`).join(""):`<div class="list" style="margin-top:14px"><div class="empty">この月の記録はありません</div></div>`}
  `;
}

// iPhoneのロックダウンモードでは Web Audio が使えないため、
// 音をその場でWAVデータに書き出して <audio> で鳴らす
const SR=22050;
function renderWav(notes,dur){
  const n=Math.ceil(SR*dur),buf=new Float32Array(n);
  for(const nt of notes){
    const s0=Math.floor(nt.at*SR),len=Math.floor(nt.d*SR);let ph=0;
    for(let i=0;i<len&&s0+i<n;i++){
      const k=i/len,tt=i/SR;
      const f=nt.to?nt.f*Math.pow(nt.to/nt.f,Math.min(1,k/.8)):nt.f;
      ph+=2*Math.PI*f/SR;
      let v;
      if(nt.noise) v=Math.random()*2-1;
      else if(nt.type==="square") v=Math.sin(ph)>=0?.6:-.6;
      else if(nt.type==="saw") v=((ph/(2*Math.PI))%1)*1.2-.6;
      else if(nt.type==="sine") v=Math.sin(ph);
      else v=2/Math.PI*Math.asin(Math.sin(ph));
      buf[s0+i]+=v*nt.vol*Math.min(1,tt/.01)*Math.pow(1-k,1.6);
    }
  }
  let peak=0;for(let i=0;i<n;i++)peak=Math.max(peak,Math.abs(buf[i]));
  if(peak>.9) for(let i=0;i<n;i++) buf[i]*=.9/peak;
  const dv=new DataView(new ArrayBuffer(44+n*2)),w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");dv.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) dv.setInt16(44+i*2,Math.max(-1,Math.min(1,buf[i]))*32767,true);
  return URL.createObjectURL(new Blob([dv],{type:"audio/wav"}));
}
const N=(f,at,d,type="tri",vol=.2,to)=>({f,at,d,type,vol,to});
function cheerNotes(extra){
  const a=[N(392,0,.18,"square",.12,784)];
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>a.push(N(f,.12+i*.075,.32,"tri",.28)));
  [1318.5,1567.98,2093].forEach((f,i)=>a.push(N(f,.45+i*.05,.45,"sine",.13)));
  a.push({noise:1,at:.12,d:.15,vol:.05});
  if(extra) [1567.98,2093,2637].forEach((f,i)=>a.push(N(f,.8+i*.09,.35,"sine",.16)));
  return a;
}
function rollNotes(dur){
  const a=[];let at=0,gap=.14,k=0;
  while(at<dur){a.push(N(360+k*40,at,.06,"square",.1));at+=gap;gap=Math.max(.035,gap*.82);k++;}
  a.push(N(300,0,dur,"saw",.05,1200)); // ぐいーんと上がるため音
  return a;
}
function winNotes(o){
  const a=[{noise:1,at:o,d:.25,vol:.25}];
  [523.25,659.25,783.99].forEach((f,i)=>a.push(N(f,o+.15+i*.1,.22,"tri",.26)));
  [1046.5,1318.5,1567.98].forEach(f=>a.push(N(f,o+.5,.9,"tri",.13)));
  [2093,2637,3136].forEach((f,i)=>a.push(N(f,o+.55+i*.07,.5,"sine",.08)));
  return a;
}
function sparkleNotes(o){
  const a=[],sc=[2093,2349,2637,3136,3520,4186];
  for(let i=0;i<14;i++) a.push(N(sc[Math.floor(Math.random()*sc.length)],o+i*.07,.3,"sine",.06));
  [523.25,659.25,783.99,1046.5].forEach(f=>a.push(N(f,o+.9,1,"tri",.1)));
  return a;
}
function emptyNotes(o){return [[392,370],[349,330],[311,262]].map(([f,to],i)=>N(f,o+i*.32,i===2?.7:.3,"saw",.12,to));}
const sndCache={};
function snd(key){
  if(sndCache[key]) return sndCache[key];
  const R=1.9;
  if(key==="cheer") sndCache[key]=renderWav(cheerNotes(false),1.1);
  if(key==="cheer2") sndCache[key]=renderWav(cheerNotes(true),1.3);
  const C=.9; // タップしてから開くまで
  if(key==="win") sndCache[key]=renderWav(rollNotes(C).concat(winNotes(C),sparkleNotes(C+.35)),C+2.2);
  if(key==="empty") sndCache[key]=renderWav(rollNotes(C).concat(emptyNotes(C)),C+1.4);
  if(key==="drop") sndCache[key]=renderWav([N(1400,0,.5,"sine",.12,300),N(110,.5,.25,"sine",.5,60),{noise:1,at:.5,d:.12,vol:.12},N(180,.72,.15,"sine",.25,90)],1.1);
  return sndCache[key];
}
function play(key){
  if(state.sound===false) return;
  try{const a=new Audio(snd(key));a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
const SFX={cheer:extra=>play(extra?"cheer2":"cheer"),gachaWin:()=>play("win"),gachaEmpty:()=>play("empty"),drop:()=>play("drop")};
// 先に作っておく（押した瞬間にすぐ鳴らすため）
setTimeout(()=>{try{["cheer","cheer2","win","empty","drop"].forEach(snd);}catch(e){}},800);

const TICKET_YEN=5000;
const SLOTS=()=>Math.max(100,CHARACTERS.length); // 一覧に並べる枠の数（No.100まで）
const charById=id=>CHARACTERS.find(c=>c.id===id);
const ownedChars=()=>state.owned.map(charById).filter(Boolean);
const pickChar=()=>{const o=ownedChars();return o.length?o[Math.floor(Math.random()*o.length)]:null;};
function celebrate(from,to,n){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el=$(".hero .total");
  if(el&&!reduce){
    const t0=performance.now(),dur=900;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=yen(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else{el.classList.add("bump");}};
    el.textContent=yen(from);requestAnimationFrame(step);
  }
  const g=goalOf(), hit=from<g&&to>=g;

  const box=document.createElement("div");box.className="cheer";box.setAttribute("role","status");
  const ch=pickChar();
  const gotTicket=Math.floor(realTotal()/TICKET_YEN)>Math.floor((realTotal()-n)/TICKET_YEN);
  const sub=gotTicket?" 🎟 チケットゲット！":hit?" 目標たっせい！":"";
  SFX.cheer(gotTicket||hit);
  box.innerHTML=`<div class="cheer-card"><div class="cheer-bubble">${ch?ch.line:"+"+yen(n)}<small>${ch?"+"+yen(n)+sub:(gotTicket?"🎟 チケットゲット！":ticketsLeft()?"ガチャで仲間を呼ぼう":"")}</small></div>
    ${ch?`<img class="cheer-face" src="${ch.img}" alt="">`:""}<span class="cheer-close">タップでとじる</span></div>`;
  document.body.appendChild(box);
  if(!reduce){
    const colors=["#a9daf0","#28799b","#e4f5fb","#ffffff","#7fd0e8","#ffd6e0"];
    const count=hit?60:28;
    for(let i=0;i<count;i++){
      const c=document.createElement("i");c.className="confetti";
      c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];
      c.style.setProperty("--x",(Math.random()*120-60)+"px");c.style.setProperty("--r",(Math.random()*720+180)+"deg");
      c.style.setProperty("--d",(1.3+Math.random()*1.1)+"s");c.style.setProperty("--delay",(Math.random()*.25)+"s");
      if(Math.random()<.4){c.style.borderRadius="50%";c.style.width=c.style.height="9px";}
      document.body.appendChild(c);setTimeout(()=>c.remove(),3000);
    }
  }
  // タップするまで出たままにする
  box.addEventListener("click",()=>{if(box.classList.contains("out"))return;box.classList.add("out");setTimeout(()=>box.remove(),320);});
}

// ---------- ガチャ ----------
function drawChar(){
  if(!state.owned.length) return CHARACTERS[0];
  const notYet=CHARACTERS.filter(c=>!state.owned.includes(c.id));
  return notYet.length?notYet[Math.floor(Math.random()*notYet.length)]:null;
}
function openGacha(){
  if(!ticketsLeft()) return;
  const ch=drawChar();
  if(ch){ state.ticketsUsed++; state.owned.push(ch.id); save(); }
  runGacha(ch);
}
function flash(){
  const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),800);
}
// 豪華ガチャ演出：夜空 → カプセル落下 → タップ待ち → ためる → 爆発 → カードがくるっと表に
function runGacha(ch){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const no=ch?CHARACTERS.indexOf(ch)+1:0;
  let stars="";for(let i=0;i<40;i++) stars+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*2).toFixed(2)}s;--s:${(Math.random()*2+1).toFixed(1)}px"></i>`;
  const front=ch?`<div class="g-front">
        <span class="g-new">NEW!</span>
        <div class="g-photo"><img src="${ch.img}" alt=""><span class="g-sweep"></span></div>
        <div class="g-name">${esc(ch.name)}</div>
        <div class="g-msg">が仲間になった！</div>
        <button class="btn" id="gachaClose" style="margin-top:12px">やったね</button>
      </div>`:`<div class="g-front">
        <div class="empty-cap" aria-hidden="true">🫙</div>
        <div class="g-msg" style="margin-top:6px">空っぽみたい…<br>ぽんさんに連絡しよう！</div>
        <p class="note" style="margin:6px 0 0;text-align:center">チケットは減っていないよ</p>
        <button class="btn" id="gachaClose" style="margin-top:12px">とじる</button>
      </div>`;
  $("#sheetRoot").innerHTML=`<div class="g-stage${reduce?" s-reveal":" s-drop"}" id="gStage" role="dialog" aria-label="ガチャ">
    <div class="g-stars">${stars}</div>
    <div class="g-rays"></div>
    <div class="g-cap" id="gCap" aria-label="カプセルをタップして開ける" role="button" tabindex="0">
      <i class="cap-top"></i><i class="cap-bottom"></i><i class="cap-band"></i><span class="g-glint"></span>
    </div>
    <div class="g-hint">タップして開けよう！</div>
    <div class="g-card"><div class="g-flip"><div class="g-back">？</div>${front}</div></div>
  </div>`;
  const stage=$("#gStage");
  if(reduce){ if(ch) SFX.gachaWin(); else SFX.gachaEmpty(); return; }
  SFX.drop();
  let opened=false;
  const wait=setTimeout(()=>stage.classList.replace("s-drop","s-wait"),900);
  const open=()=>{
    if(opened) return; opened=true; clearTimeout(wait);
    stage.className="g-stage s-charge";
    if(ch) SFX.gachaWin(); else SFX.gachaEmpty();       // タップの瞬間に鳴らす（iPhone対策）
    setTimeout(()=>{stage.className="g-stage s-burst"+(ch?"":" is-empty");flash();},900);
    setTimeout(()=>{stage.className="g-stage s-reveal"+(ch?"":" is-empty");if(ch) confettiBurst(70);},1250);
  };
  $("#gCap").addEventListener("click",open);
  $("#gCap").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")open();});
  // 放っておいても5秒で自動で開く
  setTimeout(()=>{if(!opened&&document.body.contains(stage)) open();},6000);
}
function confettiBurst(count){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors=["#a9daf0","#28799b","#e4f5fb","#ffffff","#7fd0e8","#ffd6e0"];
  for(let i=0;i<count;i++){
    const c=document.createElement("i");c.className="confetti";c.style.zIndex=60;
    c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];
    c.style.setProperty("--x",(Math.random()*120-60)+"px");c.style.setProperty("--r",(Math.random()*720+180)+"deg");
    c.style.setProperty("--d",(1.3+Math.random()*1.1)+"s");c.style.setProperty("--delay",(Math.random()*.25)+"s");
    if(Math.random()<.4){c.style.borderRadius="50%";c.style.width=c.style.height="9px";}
    document.body.appendChild(c);setTimeout(()=>c.remove(),3000);
  }
}
function closeSheet(){$("#sheetRoot").innerHTML="";}

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target;
  const go=t.closest("[data-tab],[data-go]"); if(go){tab=go.dataset.tab||go.dataset.go;confirmDel=null;openId=null;render();window.scrollTo(0,0);return;}
  if(t.closest("#avatarBtn")){tab="settings";confirmDel=null;render();window.scrollTo(0,0);return;}
  if(t.closest("#addBtn")){openSheet();return;}
  if(t.closest("#gachaBtn")){openGacha();return;}
  if(t.closest("#soundToggle")){state.sound=state.sound===false;save();render();if(state.sound)SFX.cheer();return;}
  if(t.closest("#gachaClose")||(t.id==="charScrim")){closeSheet();render();return;}
  const chb=t.closest("[data-char]"); if(chb){openCharDetail(chb.dataset.char);return;}
  const del=t.closest("[data-del]");
  if(del){const id=del.dataset.del;
    if(confirmDel===id){state.records=state.records.filter(r=>r.id!==id);confirmDel=null;openId=null;save();render();toast("削除しました");}
    else{confirmDel=id;render();}
    return;}
  const it=t.closest("[data-item]");
  if(it){openId=openId===it.dataset.item?null:it.dataset.item;confirmDel=null;render();return;}
  if(t.closest("#clearSample")){state.records=state.records.filter(r=>!r.sample);save();render();toast("サンプルを消しました");return;}
  const bm=t.closest("[data-month]"); if(bm){histMonth=bm.dataset.month;render();return;}
  if(t.closest("#prevM")||t.closest("#nextM")){
    const [y,m]=histMonth.split("-").map(Number);const d=new Date(y,m-1+(t.closest("#prevM")?-1:1),1);
    if(mkey(d)<=mkey(new Date())){histMonth=mkey(d);render();}return;}
  if(t.closest("#removeProfile")){delete state.profileImage;save();render();toast("写真を削除しました");return;}
  if(t.closest("#addCatBtn")){
    if(activeCats().length>=MAX_CATS){$("#catMsg").textContent="選択肢は6個までです";return;}
    const label=$("#newCatName").value.trim();
    if(!label){$("#catMsg").textContent="名前を入力してください";return;}
    if(activeCats().some(c=>c.label===label)){ $("#catMsg").textContent="同じ名前の選択肢があります";return;}
    const id="custom_"+uid(),iconIndex=nextIconIndex();
    state.categories.push({id,label,iconIndex});state.categoryIconMap[id]=iconIndex;
    save();render();toast("選択肢を追加しました");return;}
  const removeCat=t.closest("[data-cat-remove]");
  if(removeCat){
    if(activeCats().length===1){$("#catMsg").textContent="選択肢は1つ以上残してください";return;}
    const c=activeCats().find(c=>c.id===removeCat.dataset.catRemove);
    if(!c) return;
    state.categoryArchive[c.id]=c.label;
    state.categories=activeCats().filter(x=>x.id!==c.id);
    save();render();toast("選択肢を削除しました");return;}
  if(t.closest("#exportBtn")){
    const data=JSON.stringify({app:"uitacho",v:1,name:state.name,records:state.records.filter(r=>!r.sample),owned:state.owned,ticketsUsed:state.ticketsUsed,categories:state.categories,categoryArchive:state.categoryArchive,categoryIconMap:state.categoryIconMap});
    const done=()=>{$("#ioMsg").style.color="var(--hue-deep)";$("#ioMsg").textContent="コピーしました。メモ帳などに貼って保管してください";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(done).catch(()=>fallbackCopy(data));}
    else fallbackCopy(data);
    return;}
  if(t.closest("#importBtn")){
    const msg=$("#ioMsg");
    try{
      const d=JSON.parse($("#importIn").value.trim());
      if(d.app!=="uitacho"||!Array.isArray(d.records)) throw 0;
      const ids=new Set(state.records.map(r=>r.id));
      const add=d.records.filter(r=>r&&r.id&&!ids.has(r.id)&&Number(r.amount)>0);
      state.records=state.records.filter(r=>!r.sample).concat(add);
      if(!state.name&&d.name) state.name=d.name;
      if(Array.isArray(d.owned)) for(const id of d.owned) if(charById(id)&&!state.owned.includes(id)) state.owned.push(id);
      if(Number.isInteger(d.ticketsUsed)&&d.ticketsUsed>state.ticketsUsed) state.ticketsUsed=d.ticketsUsed;
      if(Array.isArray(d.categories)) for(const c of d.categories){
        if(c&&/^[a-z0-9_-]{1,40}$/.test(c.id)&&typeof c.label==="string"&&c.label.trim()&&c.label.length<=18&&!activeCats().some(x=>x.id===c.id)){
          if(activeCats().length<MAX_CATS){const iconIndex=nextIconIndex();state.categories.push({id:c.id,label:c.label.trim(),iconIndex});state.categoryIconMap[c.id]=iconIndex;}
          else state.categoryArchive[c.id]=c.label.trim();
        }
      }
      if(d.categoryArchive&&typeof d.categoryArchive==="object") for(const [id,label] of Object.entries(d.categoryArchive)){
        if(/^[a-z0-9_-]{1,40}$/.test(id)&&typeof label==="string"&&label.trim()&&label.length<=18&&!state.categoryArchive[id]) state.categoryArchive[id]=label.trim();
      }
      if(d.categoryIconMap&&typeof d.categoryIconMap==="object") for(const [id,index] of Object.entries(d.categoryIconMap)){
        if(/^[a-z0-9_-]{1,40}$/.test(id)&&Number.isInteger(index)&&index>=0&&index<MAX_CATS&&state.categoryIconMap[id]===undefined) state.categoryIconMap[id]=index;
      }
      save();render();toast(add.length+"件 読み込みました");
    }catch(err){msg.style.color="var(--danger)";msg.textContent="読み込めませんでした。「データをコピー」で出した文字列をそのまま貼り付けてください";}
    return;}
  if(t.closest("#resetBtn")){
    if(confirmDel==="__all"){state.records=[];state.owned=[];state.ticketsUsed=0;confirmDel=null;save();render();toast("すべて削除しました");}
    else{confirmDel="__all";render();}
    return;}
  if((confirmDel||openId) && !t.closest(".sheet")){confirmDel=null;openId=null;render();}
});
function fallbackCopy(text){
  const ta=$("#importIn");ta.value=text;ta.focus();ta.select();
  $("#ioMsg").style.color="var(--muted)";$("#ioMsg").textContent="自動コピーできなかったので、上の欄を長押しして「コピー」してください";
}
document.addEventListener("input",e=>{
  if(e.target.id==="nameIn"){state.name=e.target.value.trim();save();}
  if(e.target.id==="goalIn"){e.target.value=e.target.value.replace(/[^\d]/g,"").slice(0,7);const g=Number(e.target.value);if(g>0){state.goal=g;save();}}
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-cat-name]")){
    const c=activeCats().find(c=>c.id===e.target.dataset.catName);
    if(!c) return;
    const label=e.target.value.trim();
    if(!label||activeCats().some(x=>x.id!==c.id&&x.label===label)){
      e.target.value=c.label;$("#catMsg").textContent=label?"同じ名前の選択肢があります":"名前を入力してください";return;}
    c.label=label;save();render();toast("名前を変更しました");return;
  }
  if(e.target.id!=="avatarFile") return;
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  const err=$("#profileErr");
  if(!file.type.startsWith("image/")){err.textContent="画像ファイルを選んでください";return;}
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    try{
      const canvas=document.createElement("canvas");
      canvas.width=canvas.height=320;
      const side=Math.min(img.naturalWidth,img.naturalHeight);
      canvas.getContext("2d").drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,320,320);
      state.profileImage=canvas.toDataURL("image/jpeg",.8);
      save();render();toast("プロフィール画像を設定しました");
    }catch(error){err.textContent="画像を読み込めませんでした。別の写真を試してください";}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);err.textContent="画像を読み込めませんでした。別の写真を試してください";};
  img.src=url;
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="newCatName"){e.preventDefault();$("#addCatBtn").click();}});

// ---------- 新しい版のチェック ----------
let updateShown=false;
async function checkUpdate(){
  if(updateShown||location.protocol==="file:") return;
  try{
    const res=await fetch("./?check="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const m=(await res.text()).match(/const APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){
      updateShown=true;
      const bar=document.createElement("div");bar.className="update-bar";bar.setAttribute("role","status");
      bar.innerHTML=`<span>新しいバージョンがあります</span><button id="doUpdate">更新する</button>`;
      document.body.appendChild(bar);
      bar.querySelector("#doUpdate").addEventListener("click",()=>location.replace("./?v="+encodeURIComponent(m[1])));
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate();});
setTimeout(checkUpdate,1500);

render();
})();
</script>
